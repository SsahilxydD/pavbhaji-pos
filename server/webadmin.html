<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PavBhaji POS — Admin</title>
<style>
  /* Self-contained on purpose: the shop laptop is often offline, so no
     web fonts, no CDNs — the look comes from spacing, colour and motion. */
  :root {
    /* Same AA-passing tokens as pos.css (webshared.css): ink3, green, amber
       and danger were 3–4:1 on their backgrounds before. */
    --red:#c63c0a; --red-deep:#a93307; --red-dark:#7a2e0e;
    --ink:#221a12; --ink2:#6e6055; --ink3:#75665a;
    --line:#efe6da; --bg:#faf6f0; --card:#ffffff;
    --green:#17703f; --green-bg:#e4f6ea; --amber:#8f5400; --amber-bg:#fff3e2;
    --danger:#b8321f; --danger-bg:#fdecea;
    --shadow:0 1px 2px rgba(60,35,20,.06), 0 4px 16px rgba(60,35,20,.05);
    --shadow-lift:0 2px 4px rgba(60,35,20,.08), 0 10px 28px rgba(60,35,20,.09);
    --r:16px;
  }
  * { box-sizing:border-box; margin:0; }
  /* .shell{display:flex} used to beat the hidden attribute, so the sidebar
     (with live backup / logout) showed before anyone was signed in */
  [hidden] { display:none !important; }
  html { -webkit-text-size-adjust:100%; }
  body {
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:var(--bg); color:var(--ink);
    font-size:14.5px; line-height:1.45;
  }
  ::selection { background:#ffd9c4; }

  /* ---------- shell: sidebar + content ---------- */
  .shell { display:flex; min-height:100vh; }
  aside {
    width:236px; flex:0 0 236px; padding:18px 14px;
    background:linear-gradient(160deg,#d4450f,#a93307);
    color:#fff; display:flex; flex-direction:column; gap:4px;
    position:sticky; top:0; height:100vh;
  }
  .brand { display:flex; align-items:center; gap:10px; padding:6px 8px 18px; }
  .brand .tile {
    width:40px; height:40px; border-radius:13px; background:rgba(255,255,255,.16);
    display:grid; place-items:center; font-size:22px;
  }
  .brand b { font-size:15px; letter-spacing:-.3px; display:block; white-space:nowrap; }
  .brand { gap:8px; }
  /* Hinglish / हिं / ગુ chip (same as pos.css): an invisible native picker over it */
  .lang {
    position:relative; flex:0 0 auto; display:grid; place-items:center;
    min-width:44px; min-height:36px; padding:0 9px; border-radius:11px; cursor:pointer;
    font-weight:800; font-size:13.5px; line-height:1;
    background:rgba(255,255,255,.14); color:#fff; border:1px solid rgba(255,255,255,.28);
  }
  .lang select {
    position:absolute; inset:0; width:100%; height:100%; min-height:0; padding:0; margin:0;
    opacity:0; cursor:pointer; font-size:16px; border:0;
  }
  .lang:focus-within { outline:2px solid #fff; outline-offset:1px; }
  .brand small { font-size:11.5px; }
  aside nav { display:flex; flex-direction:column; gap:3px; flex:1; }
  aside nav button {
    display:flex; align-items:center; gap:10px; width:100%;
    background:transparent; border:0; color:#fff;
    font:inherit; font-weight:600; font-size:13.5px;
    padding:9px 11px; border-radius:11px; cursor:pointer; text-align:left;
    transition:background .15s, color .15s, transform .06s;
  }
  aside nav button:hover { background:rgba(255,255,255,.10); color:#fff; }
  aside nav button:active { transform:scale(.985); }
  aside nav button.on { background:rgba(255,255,255,.92); color:var(--red-dark); box-shadow:var(--shadow); }
  aside nav button .ic { font-size:16px; width:22px; text-align:center; }
  .side-foot { display:flex; flex-direction:column; gap:6px; padding-top:10px; }
  .side-foot .who { font-size:12px; padding:0 8px; }
  .side-foot button {
    font:inherit; font-weight:600; font-size:13px; cursor:pointer;
    background:rgba(255,255,255,.12); color:#fff;
    border:1px solid rgba(255,255,255,.25); border-radius:10px; padding:8px 11px;
    transition:background .15s;
  }
  .side-foot button:hover { background:rgba(255,255,255,.2); }

  main { flex:1; min-width:0; padding:26px 30px 60px; }
  .content { max-width:880px; margin:0 auto; }
  #view { animation:fadein .18s ease; }
  @keyframes fadein { from { opacity:0; transform:translateY(4px);} to { opacity:1; transform:none;} }

  h2 {
    font-size:12px; letter-spacing:.09em; color:var(--ink3);
    margin:22px 0 8px; text-transform:uppercase; font-weight:800;
  }
  .mut { color:var(--ink2); font-size:12.5px; }
  .hint { color:var(--ink3); font-size:12.5px; margin-top:10px; }

  /* ---------- cards, stats ---------- */
  .card {
    background:var(--card); border:1px solid var(--line); border-radius:var(--r);
    padding:16px; margin-bottom:12px; box-shadow:var(--shadow);
  }
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; }
  .stat {
    background:var(--card); border:1px solid var(--line); border-radius:var(--r);
    padding:13px 15px; box-shadow:var(--shadow);
  }
  .stat .lbl { display:flex; align-items:center; gap:7px; font-size:11px; font-weight:700; color:var(--ink2); }
  .stat .lbl::before { content:""; width:7px; height:7px; border-radius:99px; background:var(--dot,#c63c0a); }
  .stat b { display:block; font-size:24px; letter-spacing:-.5px; margin-top:3px; }
  .stat.green { --dot:var(--green); } .stat.green b { color:var(--green); }
  .stat.amber { --dot:var(--amber); } .stat.amber b { color:var(--amber); }
  .stat.red { --dot:var(--danger); } .stat.red b { color:var(--danger); }
  .hero {
    background:var(--card); border:1px solid var(--line); border-radius:20px;
    padding:20px 22px; margin-bottom:12px; box-shadow:var(--shadow);
  }
  .hero .lbl { font-size:11px; font-weight:800; letter-spacing:.1em; color:var(--ink3); }
  .hero b.big { font-size:40px; letter-spacing:-1.2px; color:var(--green); display:block; }

  /* ---------- rows, tables ---------- */
  .row { display:flex; align-items:center; gap:9px; padding:9px 0; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .row:last-child { border-bottom:0; }
  .grow { flex:1; min-width:120px; }
  table { width:100%; border-collapse:collapse; }
  td,th { text-align:left; padding:7px 8px; border-bottom:1px solid var(--line); font-size:14px; }
  tr:last-child td { border-bottom:0; }
  th { color:var(--ink3); font-size:11px; letter-spacing:.06em; text-transform:uppercase; }
  td.r,th.r { text-align:right; }
  .green { color:var(--green); } .redtx { color:var(--danger); } .amber { color:var(--amber); }

  /* ---------- controls ---------- */
  button {
    font:inherit; font-weight:600; font-size:13px; cursor:pointer;
    border:1px solid var(--line); background:#fff; color:var(--ink);
    border-radius:11px; padding:8px 14px;
    transition:box-shadow .15s, transform .06s, background .15s, border-color .15s;
  }
  button:hover { box-shadow:var(--shadow); border-color:#e2d5c4; }
  button:active { transform:scale(.97); }
  button.primary { background:var(--red); border-color:var(--red); color:#fff; font-weight:700; }
  button.primary:hover { background:var(--red-deep); box-shadow:var(--shadow-lift); }
  button.icon { padding:8px 10px; }
  input,select {
    font:inherit; padding:8px 11px; border:1.5px solid var(--line); border-radius:11px;
    background:#fff; max-width:100%; color:var(--ink); transition:border-color .15s, box-shadow .15s;
  }
  input:focus,select:focus { outline:none; border-color:var(--red); box-shadow:0 0 0 3px rgba(198,60,10,.12); }
  input[type=color] { padding:2px; width:40px; height:36px; border-radius:10px; cursor:pointer; }
  input.num { width:88px; } input.tiny { width:70px; }
  label.ck { display:flex; align-items:center; gap:6px; color:var(--ink2); font-size:12.5px; cursor:pointer; }

  /* checkbox → pill switch */
  input[type=checkbox].sw { appearance:none; width:38px; height:22px; border-radius:99px;
    background:#e7ddd2; border:0; position:relative; cursor:pointer; transition:background .18s; flex:none; }
  input[type=checkbox].sw::after { content:""; position:absolute; top:3px; left:3px; width:16px; height:16px;
    border-radius:99px; background:#fff; box-shadow:0 1px 2px rgba(0,0,0,.25); transition:left .18s; }
  input[type=checkbox].sw:checked { background:var(--green); }
  input[type=checkbox].sw:checked::after { left:19px; }

  .addbar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:12px;
    padding-top:12px; border-top:1px dashed var(--line); }
  .pillnav { display:flex; gap:6px; flex-wrap:wrap; margin:0 0 12px; }
  .pillnav button { border-radius:99px; padding:7px 13px; font-size:12.5px; }
  .pillnav button.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  .datebar { display:flex; align-items:center; justify-content:center; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
  .datebar b { font-size:15px; }
  /* a closed bill: number · who/when/how paid (wraps inside) · amount and 🖨
     in a fixed right column, so on a phone they never drop to a line of their own */
  .row.bill { flex-wrap:nowrap; align-items:center; cursor:pointer; }
  .row.bill .bno { min-width:40px; flex:0 0 auto; }
  .row.bill .grow { min-width:0; }
  .row.bill .bpay { display:block; font-size:12.5px; }
  .row.bill .bend { display:flex; align-items:center; gap:8px; flex:0 0 auto; white-space:nowrap; }

  /* ---------- toasts ---------- */
  #toasts { position:fixed; right:18px; bottom:18px; display:flex; flex-direction:column; gap:8px; z-index:50; }
  .toast { background:var(--ink); color:#fff; padding:10px 15px; border-radius:12px; font-size:13px;
    font-weight:600; box-shadow:var(--shadow-lift); animation:toastin .2s ease; max-width:340px; }
  .toast.ok { background:var(--green); }
  .toast.bad { background:var(--danger); }
  @keyframes toastin { from { opacity:0; transform:translateY(8px);} to { opacity:1; transform:none;} }

  /* dashboard: how the money adds up, and the doors to the other screens */
  .hero .reco { font-size:13.5px; font-weight:600; color:var(--ink); margin:6px 0 2px; }
  .doors { display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:10px; margin-top:12px; }
  .door {
    display:flex; flex-direction:column; gap:2px; text-decoration:none; color:var(--ink);
    background:var(--card); border:1px solid var(--line); border-radius:var(--r);
    padding:14px 16px; font-weight:800; font-size:15px; box-shadow:var(--shadow);
  }
  .door:hover { box-shadow:var(--shadow-lift); border-color:#e2d5c4; }
  .door small { font-size:12.5px; font-weight:500; color:var(--ink2); }

  /* stock: one big switch per dish */
  .stockhd { display:flex; flex-direction:column; gap:2px; margin-bottom:6px; }
  .stockhd b { font-size:18px; }
  .stocklist { padding:4px 16px; }
  .stockrow {
    display:flex; align-items:center; gap:12px; min-height:56px; padding:8px 0; cursor:pointer;
    border-bottom:1px solid var(--line); font-size:15.5px; font-weight:700;
  }
  .stockrow:last-child { border-bottom:0; }
  .stockrow .grow { min-width:0; }
  .stockrow .state { font-size:12px; font-weight:800; color:var(--green); text-transform:uppercase; letter-spacing:.04em; }
  .stockrow.off { color:var(--ink2); }
  .stockrow.off .state { color:var(--danger); }
  .stockrow input[type=checkbox].sw { width:52px; height:30px; }
  .stockrow input[type=checkbox].sw::after { width:24px; height:24px; }
  .stockrow input[type=checkbox].sw:checked::after { left:25px; }

  /* menu rows: every field labelled; an edited row is marked until saved */
  label.mini { display:flex; flex-direction:column; gap:2px; font-size:11px; font-weight:700; color:var(--ink2); }
  /* (zero-width label text: it never widens its column, so the rows line up) */
  label.mini > span { padding-left:3px; white-space:nowrap; width:0; overflow:visible; }
  label.mini.nm { flex:1 1 170px; min-width:150px; }
  label.mini.nm input { width:100%; }
  .row.item { align-items:flex-end; }
  .row.item { padding-left:8px; padding-right:4px; margin:0 -8px 0 -8px; }
  /* laptop: the first dish row's labels are the column header; on a phone,
     where rows wrap, every row keeps its own */
  @media (min-width:861px) { .row.item ~ .row.item label.mini > span { display:none; } }
  .row.item.dirty { box-shadow:inset 4px 0 0 var(--amber); border-radius:6px; background:#fffaf2; }
  .row.item .ck { align-self:flex-end; min-height:36px; }
  .row.item > button { align-self:flex-end; }
  .row.item > button.save { min-width:76px; }
  input::placeholder { color:var(--ink3); font-style:italic; }
  .dirtybar {
    position:fixed; right:18px; bottom:18px; z-index:45; display:flex; align-items:center; gap:12px;
    background:var(--ink); color:#fff; font-weight:700; font-size:13.5px;
    padding:8px 8px 8px 16px; border-radius:14px; box-shadow:var(--shadow-lift);
  }
  body.dirty #toasts { bottom:80px; }

  /* a small dialog (the masked new-PIN box) */
  .modal { position:fixed; inset:0; z-index:70; background:rgba(40,22,10,.45);
    display:flex; align-items:center; justify-content:center; padding:16px; }
  .modal .box { width:100%; max-width:380px; background:var(--card); border-radius:18px;
    padding:18px 18px 16px; box-shadow:0 10px 30px rgba(0,0,0,.22); }
  .modal h3 { font-size:17px; margin-bottom:12px; }
  .pinrow { display:flex; gap:8px; }
  .pinrow input { flex:1; min-width:0; min-height:46px; font-size:22px; letter-spacing:.3em; font-variant-numeric:tabular-nums; }
  .pinrow input::placeholder { font-size:15px; letter-spacing:normal; }
  .pinrow button { white-space:nowrap; }
  .btnrow { display:flex; gap:9px; margin-top:14px; }
  .btnrow > * { flex:1; min-height:44px; }

  /* reprint from a hidden frame (see printBill); paper shows only that frame */
  #printFrame { position:fixed; left:-10000px; top:0; width:360px; height:600px; border:0; }
  @media print {
    body.has-print > *:not(#printFrame) { display:none !important; }
    body.has-print #printFrame { position:static; width:100%; }
  }

  /* ---------- narrow screens: sidebar becomes a top bar ---------- */
  @media (max-width:860px) {
    .shell { flex-direction:column; }
    aside { width:100%; flex:none; height:auto; position:static; padding:12px 14px; }
    .brand { padding-bottom:10px; }
    /* the tab strip scrolls sideways: the lit tab is always scrolled into
       view (show()), and a fade on the right edge says there is more */
    aside nav {
      flex-direction:row; overflow-x:auto; padding-bottom:4px; scrollbar-width:none;
      -webkit-mask-image:linear-gradient(90deg, #000 85%, transparent);
      mask-image:linear-gradient(90deg, #000 85%, transparent);
    }
    aside nav::-webkit-scrollbar { display:none; }
    aside nav button { white-space:nowrap; width:auto; min-height:44px; }
    aside nav button:last-child { margin-right:40px; }
    .side-foot { flex-direction:row; align-items:center; padding-top:8px; }
    .side-foot .who { flex:1; }
    .side-foot button { min-height:40px; }
    main { padding:18px 14px 50px; }
    /* phone use: 16px fields (below that iOS zooms in on focus), 40px+
       buttons, 48×28 switches */
    input, select { font-size:16px; min-height:42px; }
    input[type=color] { min-height:0; height:40px; width:44px; }
    input.tiny { width:84px; } input.num { width:96px; }
    button { min-height:40px; }
    input[type=checkbox].sw { width:48px; height:28px; min-height:0; }
    input[type=checkbox].sw::after { width:22px; height:22px; }
    input[type=checkbox].sw:checked::after { left:23px; }
    label.ck { min-height:40px; }
  }
  /* phone: two stat tiles a row, and an odd one out spans the row instead
     of sitting alone under the first (the report's 3-up row was 2 + 1) */
  @media (max-width:560px) {
    .stats { grid-template-columns:repeat(2, minmax(0, 1fr)); }
    .stats > .stat:last-child:nth-child(odd) { grid-column:1 / -1; }
    .stat b { font-size:21px; }
  }
</style>
</head>
<body>

<div id="app" class="shell" hidden>
  <aside>
    <div class="brand">
      <div class="tile">🍛</div>
      <div class="grow" style="min-width:0"><b>PavBhaji POS</b><small id="panelT">admin panel</small></div>
      <label class="lang"><span id="langMark">Hinglish</span><select id="langSel" aria-label="Language / भाषा">
        <option value="hg">Hinglish</option><option value="hi">हिंदी</option><option value="gu">ગુજરાતી</option></select></label>
    </div>
    <nav id="tabs"></nav>
    <div class="side-foot">
      <span class="who" id="who"></span>
      <button id="backupBtn">⬇ backup</button>
      <button id="logoutBtn">logout</button>
    </div>
  </aside>
  <main><div class="content"><div id="view"></div></div></main>
</div>

<div class="dirtybar" id="dirtyBar" hidden><span id="dirtyN"></span><button class="primary" onclick="saveAll()" id="saveAllBtn">Save all</button></div>
<div id="toasts"></div>

<script>
'use strict';
let token = '', me = null, tab = 'dashboard', dashTimer = null;

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// Indian grouping, no decimals for whole rupees: ₹13,660 · ₹1,23,456 · ₹42.50.
const INR0 = new Intl.NumberFormat('en-IN', { maximumFractionDigits: 0 });
const INR2 = new Intl.NumberFormat('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const rupees = p => '₹' + (p % 100 === 0 ? INR0 : INR2).format(p / 100);
// "1,200" must read as 1200, not 1.
const toPaise = s => {
  const t = String(s).replace(/[₹,\s]/g, '');
  if (!/^\d*\.?\d+$|^\d+\.$/.test(t)) return null;
  const v = parseFloat(t); return isNaN(v) || v < 0 ? null : Math.round(v*100);
};
// "7:42 pm", the way the printed bill and the other screens show a time
const clock = ms => {
  const d = new Date(ms), h = d.getHours(), m = d.getMinutes();
  return (h % 12 || 12) + ':' + String(m).padStart(2, '0') + ' ' + (h < 12 ? 'am' : 'pm');
};

// ---- language ----
// Hinglish (the default) / हिं / ગુ, the same localStorage choice as the
// other browser screens (a phone that already chose हिं or ગુ keeps it).
// Hindi and Gujarati are the app's ui/L10n.kt words where it has them. The
// default keeps this page's original wording; only text added in round 2
// is in Hinglish. As in the app, dish/table/staff names and the server's
// messages stay as they are.
const LANG_KEY = 'pbpos.lang', LANG_MARK = { hg:'Hinglish', hi:'हिं', gu:'ગુ' };
let lang = 'hg';
try { lang = LANG_MARK[localStorage.getItem(LANG_KEY)] ? localStorage.getItem(LANG_KEY) : 'hg'; } catch (e) {}
const t = (hg, hi, gu) => lang === 'hi' ? hi : lang === 'gu' ? gu : hg;
let S = {};
function strings() {
  document.documentElement.lang = lang === 'hg' ? 'hi-Latn' : lang;
  S = {
    panel: t('admin panel', 'एडमिन पैनल', 'એડમિન પેનલ'),
    backup: t('⬇ backup', '⬇ बैकअप', '⬇ બેકઅપ'),
    logout: t('logout', 'बाहर निकलो', 'બહાર નીકળો'),
    tabs: {
      dashboard: t('Dashboard', 'डैशबोर्ड', 'ડેશબોર્ડ'), stock: t('Stock', 'स्टॉक', 'સ્ટોક'),
      menu: t('Menu & colours', 'मेनू और रंग', 'મેનૂ અને રંગ'), staff: t('Staff & PINs', 'स्टाफ़ और PIN', 'સ્ટાફ અને PIN'),
      tables: t('Tables', 'टेबल', 'ટેબલ'), billing: t('Billing', 'बिलिंग', 'બિલિંગ'), bills: t('Bills', 'बिल', 'બિલ'),
      report: t('Day report', 'दिन की रिपोर्ट', 'દિવસનો રિપોર્ટ'), log: t('Audit log', 'ऑडिट लॉग', 'ઓડિટ લોગ'),
    },
    noNet: t('No network — check the internet and try again', 'नेटवर्क नहीं है — इंटरनेट देखो और फिर कोशिश करो', 'નેટવર્ક નથી — ઇન્ટરનેટ જુઓ અને ફરી પ્રયત્ન કરો'),
    noServer: t('The POS server is not answering — try again', 'POS सर्वर जवाब नहीं दे रहा — फिर कोशिश करो', 'POS સર્વર જવાબ નથી આપતું — ફરી પ્રયત્ન કરો'),
    expired: t('session expired', 'सेशन खत्म — फिर से लॉग इन करो', 'સેશન પૂરું — ફરી લૉગ ઇન કરો'),
    backupFailed: t('backup failed', 'बैकअप नहीं हुआ', 'બેકઅપ ન થયો'),

// Non-blocking feedback instead of alert(): slides up bottom-right, self-clears.
function toast(msg, kind) {
  const el = document.createElement('div');
  el.className = 'toast' + (kind ? ' ' + kind : '');
  el.textContent = msg;
  $('toasts').appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; }, 2600);
  setTimeout(() => el.remove(), 3000);
}

async function api(method, path, body) {
  const r = await fetch(path, {
    method, headers: { 'Content-Type':'application/json', ...(token ? {'Authorization':'Bearer '+token} : {}) },
    body: body === undefined ? undefined : JSON.stringify(body)
  }).catch(() => { throw new Error(S.noNet); });
  if (r.status === 502 || r.status === 503 || r.status === 504) throw new Error(S.noServer);
  if (r.status === 401 && token) { logout(); throw new Error(S.expired); }
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || ('server error ' + r.status));
  return data;
}

// One front door for the whole shop: the PIN pad at "/". This page used to
// carry its own second login (another icon, English copy, and the app shell
// leaking under it); now it only adopts the session "/" made, and without
// an admin session it sends the browser to "/".
const TOK = 'pbpos.token', WHO = 'pbpos.staff';
function logout() {
  if (token) fetch('/api/logout', { method:'POST', headers:{ 'Authorization':'Bearer ' + token } }).catch(()=>{});
  token = ''; me = null; clearInterval(dashTimer);
  localStorage.removeItem(TOK); localStorage.removeItem(WHO);
  location.replace('/');
}
$('logoutBtn').onclick = logout;
$('backupBtn').onclick = async () => {
  const r = await fetch('/api/admin/backup', { headers:{'Authorization':'Bearer '+token} });
  if (!r.ok) { toast(S.backupFailed, 'bad'); return; }
  const blob = await r.blob();
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (r.headers.get('Content-Disposition')||'').match(/filename="(.+)"/)?.[1] || 'pbpos-backup.db';
  a.click(); URL.revokeObjectURL(a.href);
  toast(S.backupDone, 'ok');
};

  dashboard:'📊', stock:'📦', menu:'🎨', staff:'👥', tables:'🪑', billing:'🧾', bills:'💳', report:'📈', log:'📜'
};

// the language chip in the sidebar: re-words the whole page in place
function paintChrome() {
  $('langSel').value = lang;
  $('langMark').textContent = LANG_MARK[lang];
  $('panelT').textContent = S.panel;
  $('backupBtn').textContent = S.backup;
  $('logoutBtn').textContent = S.logout;
  $('saveAllBtn').textContent = S.saveAll;
}
$('langSel').onchange = function () {
  if (tab === 'menu' && dirtyRows().length && !confirm(S.leaveUnsaved(dirtyRows().length))) { this.value = lang; return; }
  lang = this.value;
  try { localStorage.setItem(LANG_KEY, lang); } catch (e) {}
  strings(); paintChrome();
  const keep = tab; tab = '';
  show(keep);
};
function show(t) {
  // menu rows edited but not saved: ask before the tab switch throws them away
  if (tab === 'menu' && t !== 'menu' && dirtyRows().length && !confirm(S.leaveUnsaved(dirtyRows().length))) return;
  $('dirtyBar').hidden = true; document.body.classList.remove('dirty');
  tab = t; clearInterval(dashTimer);
  $('tabs').innerHTML = Object.entries(TABS).map(([k,ic]) =>

}

async function saveItem(id, btn) {
  const row = btn.closest('.row');
  const price = toPaise(row.querySelector('.price').value);
  const name = row.querySelector('.name').value.trim();
  if (!name || price === null) { toast(S.namePriceNeeded, 'bad'); return false; }
  const body = {
    name, price,
    station: row.querySelector('.station').value,
    colour: row.querySelector('input[type=color]').value,
    batchCap: parseInt(row.querySelector('.cap').value) || 0,
    batchAgeMin: parseInt(row.querySelector('.age').value) || 0,
  };
  try {
    await api('PATCH', '/api/admin/menu-items/'+id, body);
    markDirty(row, false);
    btn.textContent = S.saved; setTimeout(() => { if (!row.classList.contains('dirty')) btn.textContent = S.save; }, 1200);
    return true;
  } catch (e) { toast(e.message, 'bad'); return false; }
}

function markDirty(row, on) {

function askPin(name) {
  return new Promise(resolve => {
    const m = document.createElement('div');
    m.className = 'modal';
    m.innerHTML = `<div class="box" role="dialog" aria-modal="true" aria-labelledby="mpT">
      <h3 id="mpT">${esc(S.pinTitle(name))}</h3>
      <div class="pinrow"><input id="mPin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4"
        autocomplete="new-password" aria-label="${esc(S.pin4)}" placeholder="${esc(S.pin4)}">
        <button type="button" id="mPinEye" aria-pressed="false">${esc(S.showPin)}</button></div>
      <p class="hint" id="mPinMsg">${esc(S.pinHint)}</p>
      <div class="btnrow"><button type="button" id="mPinNo">${esc(S.keep)}</button>
        <button type="button" class="primary" id="mPinOk">${esc(S.setPin)}</button></div></div>`;
    document.body.appendChild(m);
    const inp = m.querySelector('#mPin'), eye = m.querySelector('#mPinEye');
    const done = v => { document.removeEventListener('keydown', onKey, true); m.remove(); resolve(v); };
    const go = () => {
      const v = inp.value.trim();
      if (!/^\d{4}$/.test(v)) {
        const msg = m.querySelector('#mPinMsg');
        msg.textContent = S.pin4only; msg.className = 'hint redtx'; inp.focus(); return;
      }
      done(v);
    };
    const onKey = e => {
      if (e.key === 'Escape') { e.preventDefault(); done(null); }
      else if (e.key === 'Enter' && e.target.tagName !== 'BUTTON') { e.preventDefault(); go(); }
    };
    document.addEventListener('keydown', onKey, true);
    m.addEventListener('click', e => { if (e.target === m) done(null); });
    inp.addEventListener('input', () => {
      inp.value = inp.value.replace(/\D/g, '').slice(0, 4);
      const msg = m.querySelector('#mPinMsg');
      if (msg.classList.contains('redtx')) { msg.textContent = S.pinHint; msg.className = 'hint'; }
    });
    eye.onclick = () => {
      const show = inp.type === 'password';
      inp.type = show ? 'text' : 'password';
      eye.textContent = show ? S.hidePin : S.showPin;
      eye.setAttribute('aria-pressed', String(show));
      inp.focus();
    };
    m.querySelector('#mPinNo').onclick = () => done(null);
    m.querySelector('#mPinOk').onclick = go;
    inp.focus();
  });
}

// (it used to window.open('/bill/…?token=…')): fetch the bill with the

async function printBill(orderId) {
  let r;
  try { r = await fetch('/bill/' + orderId, { headers: { 'Authorization': 'Bearer ' + token } }); }
  catch (e) { toast(S.noNet, 'bad'); return; }
  if (!r.ok) { toast(S.printFail, 'bad'); return; }
  const html = await r.text();
  $('printFrame')?.remove();
  const f = document.createElement('iframe');
  f.id = 'printFrame'; f.setAttribute('aria-hidden', 'true'); f.tabIndex = -1;
  f.onload = () => {
    try {
      f.style.height = f.contentDocument.documentElement.scrollHeight + 'px';
      f.contentWindow.focus(); f.contentWindow.print();
    } catch (e) { window.print(); }
  };
  f.srcdoc = html;
  document.body.classList.add('has-print');
  document.body.appendChild(f);
}

      <button onclick="shiftRep(-1)">◀</button><b>${d.date}</b><button onclick="shiftRep(1)">▶</button>
      <button onclick="repDate='';report()">${esc(S.today)}</button>
    </div>
    <div class="stats">
      <div class="stat green"><span class="lbl">${esc(S.salesServed)}</span><b>${rupees(d.soldTotal)}</b></div>
      <div class="stat"><span class="lbl">${esc(S.orders)}</span><b>${d.ordersOpened}</b></div>
      <div class="stat red"><span class="lbl">${esc(S.cancelled)}</span><b>${rupees(d.cancelledTotal)}</b></div>
    </div>
    <div class="stats" style="margin-top:10px">
      <div class="stat green"><span class="lbl">${esc(S.netCollected)}</span><b>${rupees(got)}</b></div>
      <div class="stat"><span class="lbl">${esc(S.cashDrawer)}</span><b>${rupees(d.paidCash||0)}</b></div>
      <div class="stat"><span class="lbl">${esc(S.onlineUpi)}</span><b>${rupees(d.paidOnline||0)}</b></div>
      <div class="stat amber"><span class="lbl">${esc(S.discountsGiven)}</span><b>${rupees(d.discountTotal||0)}</b></div>
    </div>
    ${d.ordersOpen>0?`<p class="redtx" style="margin-top:10px">${esc(S.stillOpenDate(d.ordersOpen))}${open && open.n ? ' — ' + esc(S.notCollected(rupees(open.total))) : ''}</p>`:''}
    <h2>${esc(S.soldSection)}</h2><div class="card"><table>${lines(d.sold)}
      <tr><th>${esc(S.total)}</th><th class="r green" style="font-size:14px">${rupees(d.soldTotal)}</th></tr></table></div>
    <h2>${esc(S.byWaiter)}</h2><div class="card"><table>${d.waiters.map(w =>
      `<tr><td>${esc(w.name)} <span class="mut">(${esc(S.itemsN(w.qty))})</span></td><td class="r">${rupees(w.value)}</td></tr>`).join('') || `<tr><td class="mut">${esc(S.nothing)}</td></tr>`}</table></div>
    <h2>${esc(S.cancelledSection)}</h2><div class="card"><table>${lines(d.cancelled,'redtx')}</table>
      ${d.cancelLog.map(c => `<p class="mut" style="margin-top:6px">${clock(c.at)} · ${esc(c.by)}: ${esc(c.detail)}</p>`).join('')}</div>`;
}
function shiftRep(days) {
  const t = new Date(repDate + 'T12:00:00');
  t.setDate(t.getDate() + days);
  repDate = t.toISOString().slice(0,10);
  report();
}

// ---- audit log ----
// Opens on "everything except logins": staff logging in and out was most of
// the log. That filter is done here (the server's groups have no "not"), so
// it reads bigger pages and keeps going until it has a screenful. "All"
// still shows every event, logins included; a blocked-PIN alarm
// (login:blocked) is never hidden.
let logEvents = [], logType = 'work', logLast = 0;
const LOG_TYPES = ['work', '', 'orders', 'kitchen', 'serving', 'cancel', 'billing', 'staff'];
const LOGIN_NOISE = new Set(['login', 'logout']);
async function fetchLog(before) {
  if (logType !== 'work') {
    const d = await api('GET','/api/admin/audit?' + (before ? 'beforeId=' + before + '&' : '') + (logType ? 'type=' + logType : ''));
    return { events: d.events, last: d.events.length ? d.events[d.events.length - 1].id : before };
  }
  let out = [], last = before;
  const PAGE = 200;
  for (let page = 0; page < 5 && out.length < 60; page++) {
    const d = await api('GET','/api/admin/audit?limit=' + PAGE + (last ? '&beforeId=' + last : ''));
    if (!d.events.length) break;
    last = d.events[d.events.length - 1].id;
    out = out.concat(d.events.filter(e => !LOGIN_NOISE.has(e.action)));
    if (d.events.length < PAGE) break;
  }
  return { events: out, last };
}
async function log() {
  const asked = logType;
  const r = await fetchLog(0);
  if (asked !== logType) return;
  logEvents = r.events; logLast = r.last; paintLog();
}
function paintLog() {
  $('view').innerHTML = `<div class="pillnav">` + LOG_TYPES.map(k =>
    `<button class="${logType===k?'on':''}" onclick="logType='${k}';log()">${esc(S.logTypes[k])}</button>`).join('') +
    `</div><div class="card">` + (logEvents.length ? logEvents.map(e => `
    <div class="row"><span class="mut" style="min-width:62px">${clock(e.at)}</span>
      <b>${esc(e.by || S.system)}</b><span class="mut">${esc(e.action)}</span>
      <span class="grow">${esc(e.detail)}</span></div>`).join('') : `<p class="mut">${esc(S.nothingFilter)}</p>`) +
    `</div><button onclick="olderLog()" style="width:100%">${esc(S.loadOlder)}</button>`;
}
async function olderLog() {
  if (!logLast) { log(); return; }
  const asked = logType;
  const r = await fetchLog(logLast);
  if (asked !== logType) return;
  logEvents = logEvents.concat(r.events); logLast = r.last; paintLog();
}

// ---- the session from the PIN pad at "/" ---------------------------------
(function adopt() {
  let tk = null, s = null;
  try { tk = localStorage.getItem(TOK); s = JSON.parse(localStorage.getItem(WHO) || 'null'); }
  catch (e) { /* corrupt storage: treat as logged out */ }
  if (!tk || !s || s.role !== 'admin') { location.replace('/'); return; }
  token = tk; me = s;
  $('app').hidden = false;
  $('who').textContent = me.name;
  paintChrome();
  show('dashboard');
})();
</script>
