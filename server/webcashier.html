// The server answers bill edits in English; the cashier reads them in her
// own language (the app's billErrorText). Anything else shows as sent.
function billError(msg) {
  msg = String(msg || '');
  if (msg.indexOf('payment exceeds') === 0) return S.payMoreThanBill;
  if (msg.indexOf('discount must be') === 0) return S.discountTooBig;
  if (msg.indexOf('order already closed') === 0) return S.alreadyClosed;
  return msg;
}

var $ = function (id) { return document.getElementById(id); };
var esc = function (s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
  });
};
// Money is paise on the wire. On screen it is Indian-grouped with no decimals
// for whole rupees — ₹13,660, ₹1,23,456, ₹42.50 — the same as the app.
var INR0 = window.Intl ? new Intl.NumberFormat('en-IN', { maximumFractionDigits: 0 }) : null;
var INR2 = window.Intl ? new Intl.NumberFormat('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : null;
var rupees = function (p) {
  var whole = p % 100 === 0;
  if (!INR0) return '₹' + (whole ? p / 100 : (p / 100).toFixed(2));
  return '₹' + (whole ? INR0 : INR2).format(p / 100);
};
var clock = function (ms) { return new Date(ms).toTimeString().slice(0, 5); };
// "1,200" typed (or pasted from the screen) must be 1200, not 1.
var toPaise = function (s) {
  var t = String(s).replace(/[₹,\s]/g, '');
  if (!/^\d*\.?\d+$|^\d+\.$/.test(t)) return null;
  var v = parseFloat(t);
  return isNaN(v) || v < 0 ? null : Math.round(v * 100);
};

function toast(msg, kind) {
  // A second tap on a dead network shouldn't stack an identical toast.
  var last = $('toasts').lastElementChild;
  if (last && last.textContent === msg) return;
  var el = document.createElement('div');
  el.className = 'toast' + (kind ? ' ' + kind : '');
  el.textContent = msg;
  $('toasts').appendChild(el);
  setTimeout(function () { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; }, 3200);
  setTimeout(function () { el.remove(); }, 3600);
}

function signOut(silent) {
  if (token && !silent) fetch('/api/logout', { method:'POST', headers:{ 'Authorization':'Bearer ' + token } }).catch(function () {});
  localStorage.removeItem(TOK); localStorage.removeItem(WHO);
  location.replace('/');
}
$('logoutBtn').onclick = function () { signOut(false); };

// ---------------------------------------------------------------- network
// Same as the manager screen: every call gives up after NET_TIMEOUT and says
// so in plain words; two misses in a row raise an amber strip under the
// header that stays until the server answers again.
var NET_TIMEOUT = 12000;
var net = { fails: 0, lastOk: Date.now(), probe: null };
var repaint = null;   // what is on screen; re-run when the net is back

function netError(msg) { var e = new Error(msg); e.network = true; return e; }

function paintNet(on) {
  $('net').hidden = !on;
  if (on) {
    $('net').innerHTML = '<span>' + esc(S.netDown + clock(net.lastOk)) + '</span>' +
      '<button id="netRetry">' + esc(S.retryShort) + '</button>';
    $('netRetry').onclick = probeNet;
  }
  syncTop();
}
function netFail() {
  net.fails++;
  if (net.fails >= 2 || navigator.onLine === false) paintNet(true);
  if (!net.probe) net.probe = setInterval(probeNet, 5000);
}
function netOk() {
  net.fails = 0; net.lastOk = Date.now();
  if (net.probe) { clearInterval(net.probe); net.probe = null; }
  if (!$('net').hidden) {
    paintNet(false);
    if (repaint) repaint().catch(function () {});
  }
}
function probeNet() { api('GET', '/api/ping').catch(function () {}); }
window.addEventListener('offline', function () { netFail(); paintNet(true); });
window.addEventListener('online', probeNet);

async function api(method, path, body) {
  var ctl = window.AbortController ? new AbortController() : null;
  var tm = ctl ? setTimeout(function () { ctl.abort(); }, NET_TIMEOUT) : 0;
  var r;
  try {
    r = await fetch(path, {
      method: method,
      headers: { 'Content-Type':'application/json', 'Authorization':'Bearer ' + token },
      body: body === undefined ? undefined : JSON.stringify(body),
      signal: ctl ? ctl.signal : undefined
    });
  } catch (e) {
    netFail();
    throw netError(e && e.name === 'AbortError' ? S.slowNet : S.noNet);
  } finally { clearTimeout(tm); }
  // Caddy answers these itself when the POS server behind it is down.
  if (r.status === 502 || r.status === 503 || r.status === 504) { netFail(); throw netError(S.noServer); }
  netOk();
  if (r.status === 401) { signOut(true); throw new Error(S.expired); }
  var d = await r.json().catch(function () { return {}; });
  if (!r.ok) {
    var e = new Error(d.error || ('server error ' + r.status));
    e.status = r.status; e.blockers = d.blockers;
    throw e;
  }
  return d;
}

// A screen that could not load says why, with a retry, instead of hanging on
// a spinner line or showing the previous screen's data.
function failView(e, again) {
  $('view').innerHTML = '<div class="empty err-net">⚠ ' + esc(e.message) +
    '<br><button class="ghost" id="againBtn">' + esc(S.retry) + '</button></div>';
  $('againBtn').onclick = again;
}

// Print without leaving the bill. It used to window.open('/bill/…?token=…'):
// a new tab with no way back (in an iPhone home-screen app it jumped out to
// Safari) and the session token in the browser history. Now the bill page is
// fetched with the session in a header — no token in any URL — put into a
// hidden same-origin frame, and printed from there; the cashier stays on the
// bill. (iOS Safari prints the top page rather than a frame, so pos.css
// shows only that frame on paper — see #printFrame.)
async function printBill(orderId) {
  var r;
  try {
    r = await fetch('/bill/' + orderId, { headers: { 'Authorization': 'Bearer ' + token } });
  } catch (e) { toast(S.noNet, 'bad'); return; }
  if (!r.ok) { toast(S.printFail, 'bad'); return; }
  var html = await r.text();
  var old = $('printFrame');
  if (old) old.remove();
  var f = document.createElement('iframe');
  f.id = 'printFrame';
  f.title = S.print;
  f.setAttribute('aria-hidden', 'true');
  f.tabIndex = -1;
  f.onload = function () {
    try {
      f.style.height = f.contentDocument.documentElement.scrollHeight + 'px';
      f.contentWindow.focus();
      f.contentWindow.print();
    } catch (e) { window.print(); }
  };
  f.srcdoc = html;
  document.body.classList.add('has-print');
  document.body.appendChild(f);
}

// ---------------------------------------------------------------- shell state
var tab = 'open';      // lit tab in the strip
var timer = null;      // the one poll that is allowed to be running
var cur = null;        // { id, history, readOnly, sub, order, bill, split } while a bill is open
var modalUp = false;
var billsDate = null;  // null = today

function stopPoll() { clearInterval(timer); timer = null; repaint = null; }
// Bumped on every screen switch. A slow load (up to NET_TIMEOUT offline) that
// finishes after the cashier has moved on must not paint or start a poll.
var nav = 0;

// The tile is a real <button>: on a bill it is the way back, reachable by
// Tab and Enter (it used to be a <div> only a mouse could use).
function setTop(icon, title, sub, onIcon) {
  var tile = $('tile');
  tile.textContent = icon;
  tile.className = 'tile' + (onIcon ? ' back' : '');
  tile.disabled = !onIcon;
  tile.onclick = onIcon || null;
  tile.setAttribute('aria-label', onIcon ? S.back : S.title);
  $('ttlT').textContent = title;
  $('ttlS').textContent = sub || '';
  syncTop();
}

// The tab strip and other sticky bits sit under the header, whose height
// changes with the offline strip and the phone's notch.
function syncTop() {
  document.documentElement.style.setProperty('--top-h', document.querySelector('.top').offsetHeight + 'px');
}
window.addEventListener('resize', syncTop);

var TABS = { open:'🍽', bills:'🧾' };
function paintTabs() {
  var label = { open:S.tabOpen, bills:S.tabBills };
  $('tabs').innerHTML = Object.keys(TABS).map(function (k) {
    return '<button class="' + (k === tab ? 'on' : '') + '" data-tab="' + k + '">' +
           TABS[k] + ' ' + esc(label[k]) + '</button>';
  }).join('');
}

// The language chip: re-words whatever is on screen. A half-typed amount
// survives (the bill keeps it in cur), an open dialog is simply closed.
function paintChrome() {
  $('langSel').value = lang;
  $('langMark').textContent = LANG_MARK[lang];
  $('logoutBtn').textContent = S.logout;
}
$('langSel').onchange = function () {
  lang = this.value;
  try { localStorage.setItem(LANG_KEY, lang); } catch (e) {}
  strings();
  paintChrome();
  hideModal();
  if (cur) { if (cur.order) paintBill(); return; }
  paintTabs();
  setTop('🧾', S.title, me.name, null);
  if (repaint) repaint().catch(function () {});
};
$('tabs').addEventListener('click', function (e) {
  var b = e.target.closest('button[data-tab]');
  if (b) show(b.dataset.tab);
});

// A laptop-wide screen gets the bill in two columns (pos.css .billgrid).
var WIDE = window.matchMedia ? window.matchMedia('(min-width:1024px)') : { matches: false };
(function () {
  var again = function () { if (cur && cur.order) paintBill(); };
  if (WIDE.addEventListener) WIDE.addEventListener('change', again);
  else if (WIDE.addListener) WIDE.addListener(again);
})();

function show(t) {
  tab = t; cur = null; stopPoll(); nav++;
  $('view').classList.remove('wide'); document.body.classList.remove('wide');
  $('tabs').hidden = false;
  $('bar').className = ''; $('bar').innerHTML = '';
  setTop('🧾', S.title, me.name, null);
  paintTabs();
  ({ open:openOrders, bills:billsList })[t]();
}

// ---------------------------------------------------------------- open orders
async function openOrders() {
  var paint = async function () {
    var d = await api('GET', '/api/tables');
    if (tab !== 'open' || cur) return;
    var busy = (d.tables || []).filter(function (t) { return t.order; });
    if (!busy.length) { $('view').innerHTML = '<div class="empty">' + esc(S.noOpen) + '</div>'; return; }
    // Each tile shows where its money stands, so "paid, just close it" and
    // "nothing collected yet" can be told apart across a busy room. The
    // tables list doesn't carry payments, so each open order's bill is read
    // too (one small GET each; no bill yet = nothing collected).
    var bills = await Promise.all(busy.map(function (t) {
      return api('GET', '/api/orders/' + t.order.orderId + '/bill').catch(function (e) {
        return e.status === 404 ? 'none' : null;    // null: couldn't ask — no badge
      });
    }));
    if (tab !== 'open' || cur) return;
    var rows = busy.map(function (t, i) { return { t: t, pay: payState(t.order, bills[i]) }; });
    // paid-but-not-closed first: those are one tap from done
    rows = rows.filter(function (r) { return r.pay && r.pay.settled; })
      .concat(rows.filter(function (r) { return !(r.pay && r.pay.settled); }));
    $('view').innerHTML = '<h2>' + esc(S.nOpen(busy.length)) + '</h2><div class="grid">' + rows.map(function (r) {
      var t = r.t, o = t.order, pay = r.pay;
      return '<button class="tile-btn busy' + (pay && pay.settled ? ' paid' : '') + '" data-order="' + o.orderId + '">' +
        '<span class="nm">' + (t.kind === 'parcel' ? '🥡 ' : '') + esc(t.name) + '</span>' +
        '<span class="sub">#' + o.orderNo + ' · ' + clock(o.openedAt) + '</span>' +
        (o.customerName ? '<span class="sub">' + esc(o.customerName) + '</span>' : '') +
        '<span class="sub">' + esc(S.items(o.itemCount)) +
          (o.pendingCount ? ' · ⏳ ' + esc(S.cooking(o.pendingCount)) : '') + '</span>' +
        '<span class="amt">' + rupees(o.total) + '</span>' +
        (pay ? '<span class="spill ' + (pay.settled ? 'ready' : 'cook') + '" style="align-self:flex-start">' +
          esc(pay.settled ? S.paidClose : S.dueAmt(rupees(pay.due))) + '</span>' : '') +
        '</button>';
    }).join('') + '</div>';
  };
  var my = nav;
  repaint = paint;
  await paint().catch(function (e) {
    if (my === nav) failView(e, function () { show('open'); });
  });
  if (my === nav) timer = setInterval(function () { paint().catch(function () {}); }, 10000);
}

// Same test as the bill screen: settled = every rupee assigned AND the bill
// still matches the live items (a KOT punched after billing re-opens it).
function payState(o, b) {
  if (b === null) return null;
  if (b === 'none') return { settled: false, due: o.total };
  var paid = b.paidCash + b.paidOnline;
  var total = o.total - Math.min(b.discount, o.total);
  return { settled: paid === b.total && b.subtotal === o.total, due: Math.max(0, total - paid) };
}

$('view').addEventListener('click', function (e) {
  var b = e.target.closest('button[data-order]');
  if (b) { openOrder(Number(b.dataset.order), false, ''); return; }
  var h = e.target.closest('button[data-bill]');
  if (h) openOrder(Number(h.dataset.bill), true, h.dataset.sub || '');
});

// ---------------------------------------------------------------- the bill
// One printed-bill row: identical dishes merged across KOTs, cancelled lines
// dropped — what the customer pays for, nothing else.
function billLines(o) {
  var map = {}, out = [];
  (o.tickets || []).forEach(function (tk) {
    (tk.items || []).forEach(function (it) {
      if (it.status === 'cancelled') return;
      var k = it.name + '|' + it.price, e = map[k];
      if (!e) { e = map[k] = { name:it.name, rate:it.price, qty:0, amt:0 }; out.push(e); }
      e.qty += it.qty; e.amt += it.qty * it.price;
    });
  });
  return out;
}

// POST is idempotent: it re-totals the running bill from the live items (a KOT
// punched mid-billing can't sneak past) and hands back the frozen one once the
// order is closed. Only a cashier may generate — an admin reads instead.
async function genBill(id) {
  if (me.role === 'cashier') {
    try { return await api('POST', '/api/orders/' + id + '/bill'); } catch (e) { /* read it instead */ }
  }
  try { return await api('GET', '/api/orders/' + id + '/bill'); }
  catch (e2) { return null; }
}

// history = a closed bill from the Bills tab. readOnly = nothing on it can
// be changed: history, or an admin looking in — the bill, payment and close
// routes are the cashier's alone on the server, so an admin used to get live
// chips, split and discount that failed with "your role (admin) is not
// allowed" on every tap.
async function openOrder(id, history, sub) {
  stopPoll(); nav++;
  var my = nav;
  cur = { id:id, history:!!history, readOnly:!!history || me.role !== 'cashier', sub:sub || '',
          order:null, bill:null, spCash:'', spUpi:'', tendered:0 };
  $('tabs').hidden = true;
  $('bar').className = ''; $('bar').innerHTML = '';
  // The way back works before the bill has loaded, so a dead network can't
  // strand the cashier on "Opening the bill…".
  setTop('‹', S.bill, '', function () { show(history ? 'bills' : 'open'); });
  $('view').innerHTML = '<div class="empty">' + esc(S.billLoading) + '</div>';
  repaint = function () { return loadBill(false); };
  await loadBill(true).catch(function (e) {
    if (my !== nav) return;
    if (!cur.order) failView(e, function () { openOrder(id, history, sub); });
    else toast(e.message, 'bad');
  });
  if (my === nav && !cur.history) timer = setInterval(function () { loadBill(false).catch(function () {}); }, 15000);
}

async function loadBill(hard) {
  var id = cur.id;
  // A background poll must never yank a half-typed amount or an open dialog
  // off the screen — it just skips that round.
  if (!hard && (modalUp || (document.activeElement && document.activeElement.tagName === 'INPUT'))) return;
  var o = await api('GET', '/api/orders/' + id);
  if (!cur || cur.id !== id) return;
  var b = await genBill(id);
  if (!cur || cur.id !== id) return;
  cur.order = o; cur.bill = b;
  paintBill();
}

function paintBill() {
  var o = cur.order, b = cur.bill;
  var lines = billLines(o);
  var itemQty = lines.reduce(function (s, l) { return s + l.qty; }, 0);
  var total = b ? b.total : o.total;
  var paid = b ? b.paidCash + b.paidOnline : 0;
  // Settled = the money is fully assigned AND the bill still matches the live
  // items; a KOT punched after billing re-opens both halves of that test.
  var settled = !!b && paid === total && b.subtotal === o.total;
  var pending = 0, ready = 0;
  (o.tickets || []).forEach(function (tk) {
    (tk.items || []).forEach(function (it) {
      if (it.status === 'pending' || it.status === 'preparing') pending += it.qty;
      else if (it.status === 'ready') ready += it.qty;
    });
  });

  setTop('‹', S.bill + ' · ' + o.tableName,
    cur.history ? cur.sub : S.orderNo(o.orderNo) + ' · ' + clock(o.openedAt) + ' · ' + o.openedByName,
    function () { show(cur.history ? 'bills' : 'open'); });

  var h = '<div class="card">';
  h += '<div style="font-size:18px;font-weight:800">' + esc(o.customerName || o.tableName) + '</div>';
  if (o.customerName) {
    var sub = (o.customerPhone ? [o.customerPhone] : []).concat([o.tableName]).join(' · ');
    h += '<div class="mut" style="font-size:12px">' + esc(sub) + '</div>';
  }
  h += '<hr class="sep">';

  h += '<div class="inv-hd"><span class="nm">' + esc(S.item) + '</span><span class="inv-c qty">' + esc(S.qty) + '</span>' +
       '<span class="inv-c">' + esc(S.rate) + '</span><span class="inv-c amt">' + esc(S.amount) + '</span></div>';
  h += lines.map(function (l) {
    return '<div class="inv-ln"><span class="nm">' + esc(l.name) + '</span>' +
      '<span class="inv-c qty">' + l.qty + '</span>' +
      '<span class="inv-c">' + rupees(l.rate) + '</span>' +
      '<span class="inv-c amt">' + rupees(l.amt) + '</span></div>';
  }).join('');
  h += '<hr class="sep">';

  if (b && b.discount > 0) {
    h += '<div class="row" style="font-size:13px"><span class="grow">' + esc(S.subtotal) + '</span>' +
         '<span class="tnum">' + rupees(b.subtotal) + '</span></div>';
    h += '<div class="row amber" style="font-size:13px;margin-top:3px">' +
         '<span class="grow">' + esc(S.discount) + (b.discountNote ? ' · ' + esc(b.discountNote) : '') + '</span>' +
         '<b class="tnum">− ' + rupees(b.discount) + '</b>' +
         (cur.readOnly ? '' : '<button class="chipbtn" id="discBtn">' + esc(S.editDiscount) + '</button>') + '</div>';
  }
  h += '<div class="row" style="margin-top:4px"><span class="tot-l grow">' + esc(S.total) + '</span>' +
       '<span class="tot-r">' + rupees(total) + '</span></div>';
  // "+ discount" was a 70×28 text link and ✎ about 20px wide: both are now
  // chip buttons with a 44px tap target.
  h += '<div class="row" style="margin-top:4px">' +
       (b && !b.discount && !cur.readOnly ? '<button class="chipbtn" id="discBtn">' + esc(S.addDiscount) + '</button>' : '') +
       '<span class="mut right" style="font-size:12px">' + esc(S.items(itemQty)) + '</span></div>';

  if (pending > 0 || ready > 0) {
    h += '<div class="amber" style="font-size:12.5px;font-weight:600;margin-top:6px">' +
         esc(S.statusLine(pending, ready)) + '</div>' +
         '<div class="mut" style="font-size:12px">' + esc(S.running) + '</div>';
  }

  // Invoice and payment are two cards: one under the other on a phone,
  // side by side on a laptop (payment + Print/Close on the right, in view).
  h += '</div><div class="paycol"><div class="card">';
  h += '<div class="row"><span class="sechd grow">' + esc(S.payment) + '</span>' +
       (b ? (settled
              ? '<span class="green" style="font-size:12px;font-weight:800">' + esc(S.paid) + '</span>'
              : '<span class="amber" style="font-size:12px;font-weight:800">' +
                esc(S.payLeft(rupees(Math.max(0, total - paid)))) + '</span>') : '') + '</div>';
  if (b) {
    h += '<div class="row" style="margin-top:6px;font-size:13.5px"><span class="grow">💵 ' + esc(S.cash) + '</span>' +
         '<b class="tnum">' + rupees(b.paidCash) + '</b></div>';
    h += '<div class="row" style="margin-top:2px;font-size:13.5px"><span class="grow">📲 ' + esc(S.online) + '</span>' +
         '<b class="tnum">' + rupees(b.paidOnline) + '</b></div>';
    if (!cur.readOnly) {
      h += '<div class="chips">' +
        '<button id="allCash" title="C"' + (total > 0 && b.paidCash === total ? ' class="on"' : '') + '>' + esc(S.allCash) + '</button>' +
        '<button id="allOnline" title="U"' + (total > 0 && b.paidOnline === total ? ' class="on"' : '') + '>' + esc(S.allOnline) + '</button>' +
        '</div>' +
        '<div class="kbdhint">' + esc(S.keysHint) + '</div>';
      // Split the way staff say it — "₹500 cash diya, baaki UPI": two boxes,
      // and typing either one fills the other with the rest of the total.
      h += '<div class="sechd" style="margin-top:12px">' + esc(S.splitHd) + '</div>' +
        '<div class="split">' +
        '<label><span>💵 ' + esc(S.cash) + '</span><input id="spCash" class="num" inputmode="decimal" autocomplete="off" placeholder="₹" value="' + esc(cur.spCash) + '"></label>' +
        '<label><span>📲 UPI</span><input id="spUpi" class="num" inputmode="decimal" autocomplete="off" placeholder="₹" value="' + esc(cur.spUpi) + '"></label>' +
        '<button class="primary" id="splitBtn">' + esc(S.splitSave) + '</button></div>';
      // Change for a big note: "Cash given ₹800 · ₹1,000 · ₹2,000" → give back.
      if (b.paidCash > 0) {
        h += '<div class="change"><span class="mut">' + esc(S.gotCash) + '</span>' +
          tenders(b.paidCash).map(function (p) {
            return '<button class="chipbtn' + (cur.tendered === p ? ' on' : '') + '" data-tender="' + p + '">' + rupees(p) + '</button>';
          }).join('') +
          (cur.tendered > b.paidCash ? '<b class="green">' + esc(S.giveBack(rupees(cur.tendered - b.paidCash))) + '</b>' : '') +
          '</div>';
      }
    }
  }
  if (cur.readOnly && !cur.history) h += '<div class="hint">👁 ' + esc(S.viewOnly) + '</div>';
  h += '</div><div id="billActs"></div></div></div>';
  $('view').classList.add('wide');
  document.body.classList.add('wide');
  $('view').innerHTML = '<div class="billgrid">' + h;

  // One row: a compact Print, then Close. Stacked, the two 46px buttons took
  // 128px — on a 360×640 phone they sat on top of the "all cash" chip. A
  // Close that can't be pressed yet says why, in ink on grey, instead of a
  // pale-green slab that read as "button broken". On a laptop the two sit
  // under the payment card instead of in a 1366px-wide bottom bar.
  var why = !b ? S.noBill
          : paid !== total ? S.payFirst(rupees(Math.max(0, total - paid)))
          : b.subtotal !== o.total ? S.billStale : '';
  var close = cur.readOnly ? '' :
    '<button class="okbtn" id="closeBtn"' + (settled ? '>' + esc(S.closeAmt(rupees(total))) : ' disabled>' + esc(why)) + '</button>';
  if (WIDE.matches) {
    $('bar').className = ''; $('bar').innerHTML = '';
    $('billActs').className = 'acts-wide';
    $('billActs').innerHTML = '<button class="ghost" id="printBtn">' + esc(S.print) + '</button>' + close;
  } else if (cur.readOnly) {
    $('bar').className = 'bar';
    $('bar').innerHTML = '<button class="ghost" id="printBtn">' + esc(S.print) + '</button>';
  } else {
    $('bar').className = 'bar acts';
    $('bar').innerHTML =
      '<button class="ghost printbtn" id="printBtn" title="' + esc(S.print) + '" aria-label="' + esc(S.print) + '">🖨</button>' + close;
  }

  $('printBtn').onclick = function () { printBill(cur.id); };
  if ($('closeBtn')) $('closeBtn').onclick = confirmClose;
  if ($('discBtn')) $('discBtn').onclick = askDiscount;
  if ($('allCash')) $('allCash').onclick = function () { setPayment(total, 0); };
  if ($('allOnline')) $('allOnline').onclick = function () { setPayment(0, total); };
  if ($('spCash')) {
    var link = function (from, to, key, otherKey) {
      from.oninput = function () {
        cur[key] = from.value;
        var p = toPaise(from.value);
        if (from.value.trim() === '') { to.value = ''; }
        else if (p !== null && p <= total) { to.value = boxAmt(total - p); }
        cur[otherKey] = to.value;
      };
    };
    link($('spCash'), $('spUpi'), 'spCash', 'spUpi');
    link($('spUpi'), $('spCash'), 'spUpi', 'spCash');
    $('splitBtn').onclick = function () {
      var c = toPaise($('spCash').value || '0'), u = toPaise($('spUpi').value || '0');
      if (c === null || u === null || c + u !== total) { toast(S.splitMust(rupees(total)), 'bad'); return; }
      cur.spCash = ''; cur.spUpi = ''; cur.tendered = 0;
      setPayment(c, u);
    };
  }
  $('view').querySelectorAll('button[data-tender]').forEach(function (btn) {
    btn.onclick = function () {
      var p = Number(btn.dataset.tender);
      cur.tendered = cur.tendered === p ? 0 : p;
      paintBill();
    };
  });
}

// An amount as typed into a box: 1366000 → "13660", 4250 → "42.50" (no
// grouping commas — it has to read back as a number).
function boxAmt(p) { return p % 100 === 0 ? String(p / 100) : (p / 100).toFixed(2); }

// The notes a customer is likely to hand over for a cash amount: the next
// ₹100, ₹500, ₹1,000 and ₹2,000 above it, smallest three.
function tenders(cash) {
  var out = [];
  [10000, 50000, 100000, 200000].forEach(function (m) {
    var p = (Math.floor(cash / m) + 1) * m;
    if (out.indexOf(p) < 0) out.push(p);
  });
  return out.sort(function (a, b) { return a - b; }).slice(0, 3);
}

async function patchBill(patch) {
  try {
    cur.bill = await api('PATCH', '/api/orders/' + cur.id + '/bill', patch);
    paintBill();
  } catch (e) { toast(billError(e.message), 'bad'); }
}
function setPayment(cash, online) { patchBill({ paidCash:cash, paidOnline:online }); }

// ---------------------------------------------------------------- dialogs
// The sheets sit at the bottom of the screen, which is exactly where an
// iPhone's keyboard opens — over the Save button. visualViewport shrinks by
// the keyboard's height; the sheet is lifted by the same amount (pos.css
// --kb) and never grows taller than what is still visible (--vvh).
function fitKeyboard() {
  var vv = window.visualViewport;
  if (!vv) return;
  var kb = Math.max(0, Math.round(window.innerHeight - vv.height - vv.offsetTop));
  document.documentElement.style.setProperty('--kb', kb + 'px');
  document.documentElement.style.setProperty('--vvh', Math.round(vv.height) + 'px');
}
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', fitKeyboard);
  window.visualViewport.addEventListener('scroll', fitKeyboard);
  fitKeyboard();
}

function showModal(title, body, buttons) {
  hideModal();
  modalUp = true;
  var m = document.createElement('div');
  m.className = 'modal';
  m.innerHTML = '<div class="box"><h3>' + esc(title) + '</h3>' + body +
    '<div class="btnrow" style="margin-top:14px">' + buttons.map(function (b, i) {
      return '<button class="' + b.cls + '" data-i="' + i + '">' + esc(b.label) + '</button>';
    }).join('') + '</div></div>';
  m.addEventListener('click', function (e) {
    if (e.target === m) { hideModal(); return; }
    var b = e.target.closest('button[data-i]');
    if (!b) return;
    var a = buttons[Number(b.dataset.i)];
    if (a.act) a.act(); else hideModal();
  });
  document.body.appendChild(m);
  return m;
}
function hideModal() {
  modalUp = false;
  var m = document.querySelector('.modal');
  if (m) m.remove();
}

// Keyboard, for the laptop at the counter. In a dialog: Esc does what its
// first button (Back) does; Enter presses the main button — Save, Close
// table — but never an amber or red one ("Close anyway"), which wants a
// deliberate click. On an open bill: C = all cash, U = all online, Enter =
// Close (which still asks first).
document.addEventListener('keydown', function (e) {
  if (e.ctrlKey || e.metaKey || e.altKey || e.isComposing) return;
  var tg = e.target.tagName;
  if (modalUp) {
    var m = document.querySelector('.modal');
    if (!m) return;
    var btns = m.querySelectorAll('.btnrow button[data-i]');
    if (e.key === 'Escape') { e.preventDefault(); if (btns[0]) btns[0].click(); else hideModal(); }
    else if (e.key === 'Enter' && tg !== 'BUTTON' && tg !== 'TEXTAREA') {
      var main = btns[btns.length - 1];
      if (main && /\b(primary|okbtn)\b/.test(main.className) && !main.disabled) { e.preventDefault(); main.click(); }
    }
    return;
  }
  if (!cur || !cur.order || cur.readOnly || tg === 'INPUT' || tg === 'TEXTAREA' || tg === 'SELECT') return;
  var k = e.key.toLowerCase();
  if (k === 'c' && $('allCash')) { e.preventDefault(); $('allCash').click(); }
  else if (k === 'u' && $('allOnline')) { e.preventDefault(); $('allOnline').click(); }
  else if (e.key === 'Enter' && tg !== 'BUTTON' && $('closeBtn') && !$('closeBtn').disabled) { e.preventDefault(); $('closeBtn').click(); }
});

// A discount over 10% of the bill or over ₹100 must say why — the audit
// log otherwise loses the reason for the biggest give-aways.
var BIG_DISCOUNT_PCT = 10, BIG_DISCOUNT_PAISE = 10000;

function askDiscount() {
  var b = cur.bill; if (!b) return;
  // the smaller of the bill's and the live order's subtotal, in case either
  // copy is a beat behind (as in the app)
  var sub = Math.min(b.subtotal, cur.order.total);
  var amt = b.discount > 0 ? boxAmt(b.discount) : '';
  var pct = function (p) { return Math.round(sub * p / 100 / 100) * 100; };   // whole rupees
  var quick = [[S.pct(5), pct(5)], [S.pct(10), pct(10)], [rupees(5000), 5000], [rupees(10000), 10000]]
    .filter(function (q) { return q[1] > 0 && q[1] <= sub; });
  var m = showModal(S.discount,
    '<div class="nchips">' + quick.map(function (q) {
      return '<button class="nchip" data-d="' + q[1] + '">' + esc(q[0]) + '</button>';
    }).join('') + '</div>' +
    '<label class="fld"><span>' + esc(S.discountAmt) + '</span>' +
      '<input id="mDisc" class="num" inputmode="decimal" autocomplete="off" value="' + amt + '"></label>' +
    '<div id="mPrev" class="tnum" style="font-weight:800;margin:-2px 0 10px"></div>' +
    '<label class="fld"><span id="mNoteL">' + esc(S.discountNote) + '</span>' +
      '<input id="mNote" maxlength="120" autocomplete="off" value="' + esc(b.discountNote) + '"></label>',
    [{ label:S.back, cls:'ghost' },
     { label:S.save, cls:'primary', act: function () {
        var raw = $('mDisc').value.trim();
        var d = raw === '' ? 0 : toPaise(raw);
        if (d === null) { toast(S.badAmount, 'bad'); return; }
        if (d > sub) { toast(S.discountTooBig, 'bad'); return; }
        if (big(d) && !$('mNote').value.trim()) { toast(S.reasonBig, 'bad'); $('mNote').focus(); return; }
        var patch = { discount:d, discountNote: $('mNote').value.trim() };
        // Money already recorded can outgrow the discounted total — the server
        // rejects that. Shrink the recorded split to the new total (online kept
        // first, the rest cash); it never grows, so no collection is invented.
        var newTotal = sub - d;
        if (b.paidCash + b.paidOnline > newTotal) {
          patch.paidOnline = Math.min(b.paidOnline, Math.max(0, newTotal));
          patch.paidCash = Math.min(b.paidCash, Math.max(0, newTotal - patch.paidOnline));
        }
        hideModal();
        patchBill(patch);
     } }]);
  function big(d) { return d > BIG_DISCOUNT_PAISE || d * 100 > sub * BIG_DISCOUNT_PCT; }
  // Live: what the customer will pay, and whether a reason is needed.
  var preview = function () {
    var raw = $('mDisc').value.trim(), d = raw === '' ? 0 : toPaise(raw);
    var p = $('mPrev');
    if (d === null) { p.className = 'tnum'; p.textContent = ''; }
    else if (d > sub) { p.className = 'tnum amber'; p.textContent = S.discountTooBig; }
    else { p.className = 'tnum green'; p.textContent = S.newTotal(rupees(sub - d)); }
    $('mNoteL').textContent = d !== null && big(d) ? S.reasonNeeded : S.discountNote;
    m.querySelectorAll('.nchip').forEach(function (c) { c.classList.toggle('on', Number(c.dataset.d) === d); });
  };
  m.querySelector('.nchips').addEventListener('click', function (e) {
    var c = e.target.closest('.nchip');
    if (!c) return;
    $('mDisc').value = boxAmt(Number(c.dataset.d));
    preview();
  });
  $('mDisc').addEventListener('input', preview);
  preview();
  $('mDisc').focus();
}

function confirmClose() {
  var total = cur.bill ? cur.bill.total : cur.order.total;
  // Unserved plates don't block the close any more — but the cashier is told
  // exactly what is going out unserved before they tap it.
  var left = [];
  (cur.order.tickets || []).forEach(function (tk) {
    (tk.items || []).forEach(function (it) {
      if (it.status !== 'served' && it.status !== 'cancelled') left.push(it.qty + '× ' + it.name);
    });
  });
  // Close is only enabled once the bill is paid, so instead of the stale
  // "collect payment before closing" the dialog says what was collected.
  var b = cur.bill, parts = [];
  if (b && b.paidCash > 0) parts.push(S.cashPart(rupees(b.paidCash)));
  if (b && b.paidOnline > 0) parts.push(S.upiPart(rupees(b.paidOnline)));
  var body = '<div class="mut">' + esc(S.totalLine(rupees(total))) +
    (parts.length ? '<br><span class="green" style="font-weight:700">' + esc(S.paidLine(parts.join(' + '))) + '</span>' : '') + '</div>';
  if (left.length) {
    body += '<div class="amber" style="font-size:13px;font-weight:600;margin-top:8px">' +
      esc(S.notServed) + '<br>• ' + left.map(esc).join('<br>• ') + '</div>' +
      '<div class="hint">' + esc(S.closeAnywayHint) + '</div>';
  }
  // "Close anyway" is a different act from a plain close — it marks plates
  // served that nobody carried out — so it looks different: amber, not green.
  showModal(S.closeQ(cur.order.tableName), body,
    [{ label:S.back, cls:'ghost' },
     { label: left.length ? S.closeAnyway : S.closeTable, cls: left.length ? 'warnbtn' : 'okbtn',
       act: function () { hideModal(); closeOrder(); } }]);
}

// Is this order closed on the server? (false when we can't even ask)
async function isClosed(id) {
  try { return (await api('GET', '/api/orders/' + id)).status === 'closed'; }
  catch (e) { return false; }
}

async function closeOrder() {
  var btn = $('closeBtn'); if (btn) btn.disabled = true;
  var id = cur.id;
  try {
    await api('POST', '/api/orders/' + id + '/close');
    toast(S.closedToast, 'ok');
    show('open');
  } catch (e) {
    // The close went through but its reply was lost on the way back: the
    // retry then hears "open order not found". That table IS closed — say
    // so and move on, instead of an error that sends the cashier hunting.
    // (Same check right away when there was no answer at all.)
    if ((e.status === 404 || e.network) && await isClosed(id)) {
      toast(S.closedToast, 'ok');
      if (cur && cur.id === id) show('open');
      return;
    }
    if (e.blockers && e.blockers.length) {
      showModal(S.cantClose,
        '<div style="font-size:14px">' + e.blockers.map(function (x) { return '• ' + esc(x); }).join('<br>') + '</div>' +
        '<div class="hint">' + esc(S.cantCloseHint) + '</div>',
        [{ label:S.back, cls:'ghost' }]);
    } else toast(billError(e.message), 'bad');
    if (btn) btn.disabled = false;
  }
}

// ---------------------------------------------------------------- bills (day's collection)
function shiftDate(date, days) {
  var p = String(date).split('-');
  var dt = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
  if (isNaN(dt.getTime())) return date;
  dt.setDate(dt.getDate() + days);
  var pad = function (n) { return (n < 10 ? '0' : '') + n; };
  return dt.getFullYear() + '-' + pad(dt.getMonth() + 1) + '-' + pad(dt.getDate());
}

async function billsList() {
  var my = nav;
  repaint = billsList;
  var d = await api('GET', '/api/bills' + (billsDate ? '?date=' + encodeURIComponent(billsDate) : ''))
    .catch(function (e) {
      if (my === nav) failView(e, billsList);
      return null;
    });
  if (!d || my !== nav || tab !== 'bills' || cur) return;
  billsDay = d;

  var h = '<div class="datenav">' +
    '<button data-day="-1">◀</button><b>' + esc(d.date) + '</b>' +
    '<button data-day="1">▶</button><button data-day="0">' + esc(S.today) + '</button></div>';
  // 45–110 bills on a busy night: find one by table, order # or customer,
  // or narrow to cash / UPI / discounted ones.
  h += '<div class="bills-find">' +
    '<input id="bQ" type="search" enterkeyhint="search" autocomplete="off" placeholder="' + esc(S.billSearch) + '" value="' + esc(billsQ) + '">' +
    '<div class="bchips">' + [['cash', '💵'], ['upi', '📲'], ['disc', S.discShort]].map(function (f) {
      return '<button class="nchip' + (billsF === f[0] ? ' on' : '') + '" data-f="' + f[0] + '" aria-pressed="' + (billsF === f[0]) + '">' + esc(f[1]) + '</button>';
    }).join('') + '</div></div>';
  h += '<div id="bRows"></div>';
  $('view').innerHTML = h;
  paintBillRows();
  $('view').querySelectorAll('button[data-day]').forEach(function (btn) {
    btn.onclick = function () {
      var n = Number(btn.dataset.day);
      billsDate = n === 0 ? null : shiftDate(d.date, n);
      billsList();
    };
  });
  $('bQ').addEventListener('input', function () { billsQ = this.value; paintBillRows(); });
  $('bQ').addEventListener('keydown', function (e) { if (e.key === 'Enter') this.blur(); });
  $('view').querySelector('.bchips').addEventListener('click', function (e) {
    var c = e.target.closest('button[data-f]');
    if (!c) return;
    billsF = billsF === c.dataset.f ? '' : c.dataset.f;
    $('view').querySelectorAll('.bchips button').forEach(function (x) {
      x.classList.toggle('on', x.dataset.f === billsF);
      x.setAttribute('aria-pressed', String(x.dataset.f === billsF));
    });
    paintBillRows();
  });
}

var billsDay = null, billsQ = '', billsF = '';

// The day's rows, filtered; the total for exactly what is listed stays in
// view in the bottom bar however far down the list you are.
function paintBillRows() {
  var all = (billsDay && billsDay.bills) || [];
  var words = billsQ.toLowerCase().replace(/#/g, ' ').split(/\s+/).filter(Boolean);
  var bs = all.filter(function (b) {
    if (billsF === 'cash' && !(b.paidCash > 0)) return false;
    if (billsF === 'upi' && !(b.paidOnline > 0)) return false;
    if (billsF === 'disc' && !(b.discount > 0)) return false;
    var hay = (b.tableName + ' ' + (b.customerName || '') + ' ' + b.orderNo + ' #' + b.orderNo).toLowerCase();
    return words.every(function (w) { return hay.indexOf(w) >= 0; });
  });
  var sum = bs.reduce(function (s, b) { return s + b.total; }, 0);
  var cash = bs.reduce(function (s, b) { return s + b.paidCash; }, 0);
  var online = bs.reduce(function (s, b) { return s + b.paidOnline; }, 0);
  var filtered = bs.length !== all.length;

  $('bRows').innerHTML = bs.length ? bs.map(function (b) {
    var money = [];
    if (b.paidCash > 0) money.push('💵 ' + rupees(b.paidCash));
    if (b.paidOnline > 0) money.push('📲 ' + rupees(b.paidOnline));
    if (b.discount > 0) money.push('· ' + esc(S.discount) + ' −' + rupees(b.discount));
    var closed = S.closedLine(clock(b.closedAt), b.closedByName);
    return '<button class="billrow" data-bill="' + b.orderId + '" data-sub="' + esc(closed) + '">' +
      '<span class="grow">' +
        '<span class="row"><span class="no">#' + b.orderNo + '</span>' +
        '<span class="who">' + esc(b.customerName || b.tableName) + '</span>' +
        (b.customerName ? '<span class="mut" style="font-size:12px">· ' + esc(b.tableName) + '</span>' : '') + '</span>' +
        '<span class="sub" style="display:block">' + esc(closed) + ' · ' + esc(S.items(b.itemCount)) + '</span>' +
        (money.length ? '<span class="pay ' + (b.discount > 0 ? 'amber' : 'green') + '" style="display:block">' +
          money.join('  ') + '</span>' : '') +
      '</span><b class="amt">' + rupees(b.total) + '</b></button>';
  }).join('') : '<div class="empty">' + esc(all.length ? S.noMatchBills : S.noBills) + '</div>';

  $('bar').className = 'bar sumbar';
  $('bar').innerHTML = '<div class="grow"><b>' + esc(filtered ? S.billsOf(bs.length, all.length) : S.billsN(bs.length)) + '</b>' +
    '<div class="mut tnum">' + esc(S.cashSum) + ' ' + rupees(cash) + ' · ' + esc(S.onlineSum) + ' ' + rupees(online) + '</div></div>' +
    '<b class="tnum sumamt">' + rupees(sum) + '</b>';
}

paintChrome();
show('open');
</script>
</body>
