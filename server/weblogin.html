<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#a93307">
<title>PavBhaji POS</title>
<link rel="stylesheet" href="/pos.css">
</head>
<body>

<div id="login">
  <div class="tile">🍽</div>
  <h1>PavBhaji POS</h1>
  <p class="sub">Apna PIN daalo</p>
  <div class="card">
    <input id="pin" type="password" inputmode="numeric" autocomplete="one-time-code"
           maxlength="8" autofocus placeholder="••••">
    <div class="err" id="err"></div>
    <button class="primary" id="go" style="width:100%">Log in</button>
  </div>
  <p class="hint">Wahi PIN jo phone app me daalte ho. PIN se hi tay hota hai konsi screen khulegi.</p>
</div>

<div id="toasts"></div>

<script>
'use strict';
// The one door. Every role types the same PIN box here; the server's answer
// (the staff row's role) decides which screen the browser lands on — so the
// shop only ever has to remember a single link.
var TOK = 'pbpos.token', WHO = 'pbpos.staff';
var HOME = { admin:'/admin', manager:'/manager', cashier:'/cashier' };

var $ = function (id) { return document.getElementById(id); };

function toast(msg, kind) {
  var el = document.createElement('div');
  el.className = 'toast' + (kind ? ' ' + kind : '');
  el.textContent = msg;
  $('toasts').appendChild(el);
  setTimeout(function () { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; }, 2600);
  setTimeout(function () { el.remove(); }, 3000);
}

// Already signed in on this phone? Don't make them retype — jump straight in.
(function () {
  try {
    var t = localStorage.getItem(TOK);
    var s = JSON.parse(localStorage.getItem(WHO) || 'null');
    if (t && s && HOME[s.role]) location.replace(HOME[s.role]);
  } catch (e) { /* corrupt storage is not worth a crash — just show the PIN box */ }
})();

async function login() {
  var pin = $('pin').value.trim();
  $('err').textContent = '';
  if (pin.length < 4) { $('err').textContent = 'PIN kam se kam 4 digit ka hai'; return; }
  $('go').disabled = true;
  try {
    var r = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ pin: pin })
    }).catch(function () {
      // No answer at all — say so instead of the browser's "Failed to fetch".
      throw new Error('Network nahi hai — dobara try karo');
    });
    if (r.status === 502 || r.status === 503 || r.status === 504) throw new Error('Server se jawab nahi aaya — dobara try karo');
    var d = await r.json().catch(function () { return {}; });
    if (!r.ok) throw new Error(d.error || ('server error ' + r.status));

    var dest = HOME[d.staff.role];
    if (!dest) {
      // waiter / chef / parcel have no browser screen — the phone app is their
      // tool. Hand the session straight back rather than leaving it dangling.
      fetch('/api/logout', { method: 'POST', headers: { 'Authorization': 'Bearer ' + d.token } });
      $('err').textContent = 'PIN sahi hai (' + d.staff.role + '), par ye role phone app me chalta hai.';
      $('pin').value = '';
      return;
    }
    localStorage.setItem(TOK, d.token);
    localStorage.setItem(WHO, JSON.stringify(d.staff));
    location.replace(dest);
  } catch (e) {
    $('err').textContent = e.message;
    $('pin').value = '';
    $('pin').focus();
  } finally {
    $('go').disabled = false;
  }
}

$('go').onclick = login;
$('pin').addEventListener('keydown', function (e) { if (e.key === 'Enter') login(); });
</script>
</body>
</html>
