<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PavBhaji POS — Admin</title>
<style>
  /* Self-contained on purpose: the shop laptop is often offline, so no
     web fonts, no CDNs — the look comes from spacing, colour and motion. */
  :root {
    /* Same AA-passing tokens as pos.css (webshared.css): ink3, green, amber
       and danger were 3–4:1 on their backgrounds before. */
    --red:#c63c0a; --red-deep:#a93307; --red-dark:#7a2e0e;
    --ink:#221a12; --ink2:#6e6055; --ink3:#75665a;
    --line:#efe6da; --bg:#faf6f0; --card:#ffffff;
    --green:#17703f; --green-bg:#e4f6ea; --amber:#8f5400; --amber-bg:#fff3e2;
    --danger:#b8321f; --danger-bg:#fdecea;
    --shadow:0 1px 2px rgba(60,35,20,.06), 0 4px 16px rgba(60,35,20,.05);
    --shadow-lift:0 2px 4px rgba(60,35,20,.08), 0 10px 28px rgba(60,35,20,.09);
    --r:16px;
  }
  * { box-sizing:border-box; margin:0; }
  /* .shell{display:flex} used to beat the hidden attribute, so the sidebar
     (with live backup / logout) showed before anyone was signed in */
  [hidden] { display:none !important; }
  html { -webkit-text-size-adjust:100%; }
  body {
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:var(--bg); color:var(--ink);
    font-size:14.5px; line-height:1.45;
  }
  ::selection { background:#ffd9c4; }

  /* ---------- shell: sidebar + content ---------- */
  .shell { display:flex; min-height:100vh; }
  aside {
    width:236px; flex:0 0 236px; padding:18px 14px;
    background:linear-gradient(160deg,#d4450f,#a93307);
    color:#fff; display:flex; flex-direction:column; gap:4px;
    position:sticky; top:0; height:100vh;
  }
  .brand { display:flex; align-items:center; gap:10px; padding:6px 8px 18px; }
  .brand .tile {
    width:40px; height:40px; border-radius:13px; background:rgba(255,255,255,.16);
    display:grid; place-items:center; font-size:22px;
  }
  .brand b { font-size:16px; letter-spacing:-.2px; display:block; }
  .brand small { font-size:11.5px; }
  aside nav { display:flex; flex-direction:column; gap:3px; flex:1; }
  aside nav button {
    display:flex; align-items:center; gap:10px; width:100%;
    background:transparent; border:0; color:#fff;
    font:inherit; font-weight:600; font-size:13.5px;
    padding:9px 11px; border-radius:11px; cursor:pointer; text-align:left;
    transition:background .15s, color .15s, transform .06s;
  }
  aside nav button:hover { background:rgba(255,255,255,.10); color:#fff; }
  aside nav button:active { transform:scale(.985); }
  aside nav button.on { background:rgba(255,255,255,.92); color:var(--red-dark); box-shadow:var(--shadow); }
  aside nav button .ic { font-size:16px; width:22px; text-align:center; }
  .side-foot { display:flex; flex-direction:column; gap:6px; padding-top:10px; }
  .side-foot .who { font-size:12px; padding:0 8px; }
  .side-foot button {
    font:inherit; font-weight:600; font-size:13px; cursor:pointer;
    background:rgba(255,255,255,.12); color:#fff;
    border:1px solid rgba(255,255,255,.25); border-radius:10px; padding:8px 11px;
    transition:background .15s;
  }
  .side-foot button:hover { background:rgba(255,255,255,.2); }

  main { flex:1; min-width:0; padding:26px 30px 60px; }
  .content { max-width:880px; margin:0 auto; }
  #view { animation:fadein .18s ease; }
  @keyframes fadein { from { opacity:0; transform:translateY(4px);} to { opacity:1; transform:none;} }

  h2 {
    font-size:12px; letter-spacing:.09em; color:var(--ink3);
    margin:22px 0 8px; text-transform:uppercase; font-weight:800;
  }
  .mut { color:var(--ink2); font-size:12.5px; }
  .hint { color:var(--ink3); font-size:12.5px; margin-top:10px; }

  /* ---------- cards, stats ---------- */
  .card {
    background:var(--card); border:1px solid var(--line); border-radius:var(--r);
    padding:16px; margin-bottom:12px; box-shadow:var(--shadow);
  }
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; }
  .stat {
    background:var(--card); border:1px solid var(--line); border-radius:var(--r);
    padding:13px 15px; box-shadow:var(--shadow);
  }
  .stat .lbl { display:flex; align-items:center; gap:7px; font-size:11px; font-weight:700; color:var(--ink2); }
  .stat .lbl::before { content:""; width:7px; height:7px; border-radius:99px; background:var(--dot,#c63c0a); }
  .stat b { display:block; font-size:24px; letter-spacing:-.5px; margin-top:3px; }
  .stat.green { --dot:var(--green); } .stat.green b { color:var(--green); }
  .stat.amber { --dot:var(--amber); } .stat.amber b { color:var(--amber); }
  .stat.red { --dot:var(--danger); } .stat.red b { color:var(--danger); }
  .hero {
    background:var(--card); border:1px solid var(--line); border-radius:20px;
    padding:20px 22px; margin-bottom:12px; box-shadow:var(--shadow);
  }
  .hero .lbl { font-size:11px; font-weight:800; letter-spacing:.1em; color:var(--ink3); }
  .hero b.big { font-size:40px; letter-spacing:-1.2px; color:var(--green); display:block; }

  /* ---------- rows, tables ---------- */
  .row { display:flex; align-items:center; gap:9px; padding:9px 0; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .row:last-child { border-bottom:0; }
  .grow { flex:1; min-width:120px; }
  table { width:100%; border-collapse:collapse; }
  td,th { text-align:left; padding:7px 8px; border-bottom:1px solid var(--line); font-size:14px; }
  tr:last-child td { border-bottom:0; }
  th { color:var(--ink3); font-size:11px; letter-spacing:.06em; text-transform:uppercase; }
  td.r,th.r { text-align:right; }
  .green { color:var(--green); } .redtx { color:var(--danger); } .amber { color:var(--amber); }

  /* ---------- controls ---------- */
  button {
    font:inherit; font-weight:600; font-size:13px; cursor:pointer;
    border:1px solid var(--line); background:#fff; color:var(--ink);
    border-radius:11px; padding:8px 14px;
    transition:box-shadow .15s, transform .06s, background .15s, border-color .15s;
  }
  button:hover { box-shadow:var(--shadow); border-color:#e2d5c4; }
  button:active { transform:scale(.97); }
  button.primary { background:var(--red); border-color:var(--red); color:#fff; font-weight:700; }
  button.primary:hover { background:var(--red-deep); box-shadow:var(--shadow-lift); }
  button.icon { padding:8px 10px; }
  input,select {
    font:inherit; padding:8px 11px; border:1.5px solid var(--line); border-radius:11px;
    background:#fff; max-width:100%; color:var(--ink); transition:border-color .15s, box-shadow .15s;
  }
  input:focus,select:focus { outline:none; border-color:var(--red); box-shadow:0 0 0 3px rgba(198,60,10,.12); }
  input[type=color] { padding:2px; width:40px; height:36px; border-radius:10px; cursor:pointer; }
  input.num { width:88px; } input.tiny { width:70px; }
  label.ck { display:flex; align-items:center; gap:6px; color:var(--ink2); font-size:12.5px; cursor:pointer; }

  /* checkbox → pill switch */
  input[type=checkbox].sw { appearance:none; width:38px; height:22px; border-radius:99px;
    background:#e7ddd2; border:0; position:relative; cursor:pointer; transition:background .18s; flex:none; }
  input[type=checkbox].sw::after { content:""; position:absolute; top:3px; left:3px; width:16px; height:16px;
    border-radius:99px; background:#fff; box-shadow:0 1px 2px rgba(0,0,0,.25); transition:left .18s; }
  input[type=checkbox].sw:checked { background:var(--green); }
  input[type=checkbox].sw:checked::after { left:19px; }

  .addbar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:12px;
    padding-top:12px; border-top:1px dashed var(--line); }
  .pillnav { display:flex; gap:6px; flex-wrap:wrap; margin:0 0 12px; }
  .pillnav button { border-radius:99px; padding:7px 13px; font-size:12.5px; }
  .pillnav button.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  .datebar { display:flex; align-items:center; justify-content:center; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
  .datebar b { font-size:15px; }

  /* ---------- toasts ---------- */
  #toasts { position:fixed; right:18px; bottom:18px; display:flex; flex-direction:column; gap:8px; z-index:50; }
  .toast { background:var(--ink); color:#fff; padding:10px 15px; border-radius:12px; font-size:13px;
    font-weight:600; box-shadow:var(--shadow-lift); animation:toastin .2s ease; max-width:340px; }
  .toast.ok { background:var(--green); }
  .toast.bad { background:var(--danger); }
  @keyframes toastin { from { opacity:0; transform:translateY(8px);} to { opacity:1; transform:none;} }

  /* dashboard: how the money adds up, and the doors to the other screens */
  .hero .reco { font-size:13.5px; font-weight:600; color:var(--ink); margin:6px 0 2px; }
  .doors { display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:10px; margin-top:12px; }
  .door {
    display:flex; flex-direction:column; gap:2px; text-decoration:none; color:var(--ink);
    background:var(--card); border:1px solid var(--line); border-radius:var(--r);
    padding:14px 16px; font-weight:800; font-size:15px; box-shadow:var(--shadow);
  }
  .door:hover { box-shadow:var(--shadow-lift); border-color:#e2d5c4; }
  .door small { font-size:12.5px; font-weight:500; color:var(--ink2); }

  /* stock: one big switch per dish */
  .stockhd { display:flex; flex-direction:column; gap:2px; margin-bottom:6px; }
  .stockhd b { font-size:18px; }
  .stocklist { padding:4px 16px; }
  .stockrow {
    display:flex; align-items:center; gap:12px; min-height:56px; padding:8px 0; cursor:pointer;
    border-bottom:1px solid var(--line); font-size:15.5px; font-weight:700;
  }
  .stockrow:last-child { border-bottom:0; }
  .stockrow .grow { min-width:0; }
  .stockrow .state { font-size:12px; font-weight:800; color:var(--green); text-transform:uppercase; letter-spacing:.04em; }
  .stockrow.off { color:var(--ink2); }
  .stockrow.off .state { color:var(--danger); }
  .stockrow input[type=checkbox].sw { width:52px; height:30px; }
  .stockrow input[type=checkbox].sw::after { width:24px; height:24px; }
  .stockrow input[type=checkbox].sw:checked::after { left:25px; }

  /* menu rows: every field labelled; an edited row is marked until saved */
  label.mini { display:flex; flex-direction:column; gap:2px; font-size:11px; font-weight:700; color:var(--ink2); }
  /* (zero-width label text: it never widens its column, so the rows line up) */
  label.mini > span { padding-left:3px; white-space:nowrap; width:0; overflow:visible; }
  label.mini.nm { flex:1 1 170px; min-width:150px; }
  label.mini.nm input { width:100%; }
  .row.item { align-items:flex-end; }
  .row.item { padding-left:8px; padding-right:4px; margin:0 -8px 0 -8px; }
  /* laptop: the first dish row's labels are the column header; on a phone,
     where rows wrap, every row keeps its own */
  @media (min-width:861px) { .row.item ~ .row.item label.mini > span { display:none; } }
  .row.item.dirty { box-shadow:inset 4px 0 0 var(--amber); border-radius:6px; background:#fffaf2; }
  .row.item .ck { align-self:flex-end; min-height:36px; }
  .row.item > button { align-self:flex-end; }
  .row.item > button.save { min-width:76px; }
  input::placeholder { color:var(--ink3); font-style:italic; }
  .dirtybar {
    position:fixed; right:18px; bottom:18px; z-index:45; display:flex; align-items:center; gap:12px;
    background:var(--ink); color:#fff; font-weight:700; font-size:13.5px;
    padding:8px 8px 8px 16px; border-radius:14px; box-shadow:var(--shadow-lift);
  }
  body.dirty #toasts { bottom:80px; }

  /* reprint from a hidden frame (see printBill); paper shows only that frame */
  #printFrame { position:fixed; left:-10000px; top:0; width:360px; height:600px; border:0; }
  @media print {
    body.has-print > *:not(#printFrame) { display:none !important; }
    body.has-print #printFrame { position:static; width:100%; }
  }

  /* ---------- narrow screens: sidebar becomes a top bar ---------- */
  @media (max-width:860px) {
    .shell { flex-direction:column; }
    aside { width:100%; flex:none; height:auto; position:static; padding:12px 14px; }
    .brand { padding-bottom:10px; }
    /* the tab strip scrolls sideways: the lit tab is always scrolled into
       view (show()), and a fade on the right edge says there is more */
    aside nav {
      flex-direction:row; overflow-x:auto; padding-bottom:4px; scrollbar-width:none;
      -webkit-mask-image:linear-gradient(90deg, #000 85%, transparent);
      mask-image:linear-gradient(90deg, #000 85%, transparent);
    }
    aside nav::-webkit-scrollbar { display:none; }
    aside nav button { white-space:nowrap; width:auto; min-height:44px; }
    aside nav button:last-child { margin-right:40px; }
    .side-foot { flex-direction:row; align-items:center; padding-top:8px; }
    .side-foot .who { flex:1; }
    .side-foot button { min-height:40px; }
    main { padding:18px 14px 50px; }
    /* phone use: 16px fields (below that iOS zooms in on focus), 40px+
       buttons, 48×28 switches */
    input, select { font-size:16px; min-height:42px; }
    input[type=color] { min-height:0; height:40px; width:44px; }
    input.tiny { width:84px; } input.num { width:96px; }
    button { min-height:40px; }
    input[type=checkbox].sw { width:48px; height:28px; min-height:0; }
    input[type=checkbox].sw::after { width:22px; height:22px; }
    input[type=checkbox].sw:checked::after { left:23px; }
    label.ck { min-height:40px; }
  }
</style>
</head>
<body>

<div id="app" class="shell" hidden>
  <aside>
    <div class="brand">
      <div class="tile">🍛</div>
      <div><b>PavBhaji POS</b><small>admin panel</small></div>
    </div>
    <nav id="tabs"></nav>
    <div class="side-foot">
      <span class="who" id="who"></span>
      <button id="backupBtn">⬇ backup</button>
      <button id="logoutBtn">logout</button>
    </div>
  </aside>
  <main><div class="content"><div id="view"></div></div></main>
</div>

<div class="dirtybar" id="dirtyBar" hidden><span id="dirtyN"></span><button class="primary" onclick="saveAll()" id="saveAllBtn">Save all</button></div><div id="toasts"></div>

<script>
'use strict';
let token = '', me = null, tab = 'dashboard', dashTimer = null;

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// Indian grouping, no decimals for whole rupees: ₹13,660 · ₹1,23,456 · ₹42.50.
const INR0 = new Intl.NumberFormat('en-IN', { maximumFractionDigits: 0 });
const INR2 = new Intl.NumberFormat('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const rupees = p => '₹' + (p % 100 === 0 ? INR0 : INR2).format(p / 100);
// "1,200" must read as 1200, not 1.
const toPaise = s => {
  const t = String(s).replace(/[₹,\s]/g, '');
  if (!/^\d*\.?\d+$|^\d+\.$/.test(t)) return null;
  const v = parseFloat(t); return isNaN(v) || v < 0 ? null : Math.round(v*100);
};
const clock = ms => new Date(ms).toTimeString().slice(0,5);

// Screen text in one place.
const S = {
  save: 'Save', saved: 'Saved ✓', saveAll: 'Save all',
  colour: 'colour', name: 'name', priceRs: 'price ₹', station: 'station',
  stationHint: 'kitchen = cooked in buckets, counter = waiter hands over',
  kitchen: '🍳 kitchen', counter: '✋ counter',
  tawaCap: 'tawa cap', sealMin: 'seal (min)', auto: 'auto', inStock: 'in stock', outOfStock: 'out of stock',
  outCount: n => n ? n + ' dish' + (n === 1 ? '' : 'es') + ' out of stock' : 'Everything is in stock',
  stockHint: 'Tap a dish to switch it. It saves at once and greys out on every phone.',
  collectedToday: 'COLLECTED TODAY', closedBills: n => n + ' closed bill' + (n === 1 ? '' : 's'),
  served: 'served', discounts: 'discounts', stillOpen: (a, n) => a + ' still open on ' + n + ' table' + (n === 1 ? '' : 's'),
  refreshes: 'refreshes by itself',
  orders: 'orders', tablesOpen: 'tables open', platesCooking: 'plates cooking', phonesOnline: 'phones online',
  openManager: 'Open the Manager screen', managerWhat: 'tables, punching orders, parcels, kitchen',
  openCashier: 'Open the Cashier screen', cashierWhat: 'open bills (view only for admin) and closed bills',
  netCollected: '✅ net collected', notCollected: a => a + ' on open tables not collected yet',
  archive: 'hide everywhere',
  namePriceNeeded: 'name and a valid ₹ price are needed',
  unsaved: n => n + ' dish row' + (n === 1 ? '' : 's') + ' not saved',
  leaveUnsaved: n => n + ' edited dish row' + (n === 1 ? ' is' : 's are') + ' not saved. Leave and lose the changes?',
};

// Non-blocking feedback instead of alert(): slides up bottom-right, self-clears.
function toast(msg, kind) {
  const el = document.createElement('div');
  el.className = 'toast' + (kind ? ' ' + kind : '');
  el.textContent = msg;
  $('toasts').appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; }, 2600);
  setTimeout(() => el.remove(), 3000);
}

async function api(method, path, body) {
  const r = await fetch(path, {
    method, headers: { 'Content-Type':'application/json', ...(token ? {'Authorization':'Bearer '+token} : {}) },
    body: body === undefined ? undefined : JSON.stringify(body)
  }).catch(() => { throw new Error('No network — check the internet and try again'); });
  if (r.status === 502 || r.status === 503 || r.status === 504) throw new Error('The POS server is not answering — try again');
  if (r.status === 401 && token) { logout(); throw new Error('session expired'); }
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || ('server error ' + r.status));
  return data;
}

// One front door for the whole shop: the PIN pad at "/". This page used to
// carry its own second login (another icon, English copy, and the app shell
// leaking under it); now it only adopts the session "/" made, and without
// an admin session it sends the browser to "/".
const TOK = 'pbpos.token', WHO = 'pbpos.staff';
function logout() {
  if (token) fetch('/api/logout', { method:'POST', headers:{ 'Authorization':'Bearer ' + token } }).catch(()=>{});
  token = ''; me = null; clearInterval(dashTimer);
  localStorage.removeItem(TOK); localStorage.removeItem(WHO);
  location.replace('/');
}
$('logoutBtn').onclick = logout;
$('backupBtn').onclick = async () => {
  const r = await fetch('/api/admin/backup', { headers:{'Authorization':'Bearer '+token} });
  if (!r.ok) { toast('backup failed', 'bad'); return; }
  const blob = await r.blob();
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (r.headers.get('Content-Disposition')||'').match(/filename="(.+)"/)?.[1] || 'pbpos-backup.db';
  a.click(); URL.revokeObjectURL(a.href);
  toast('Backup downloaded ✓', 'ok');
};

const TABS = {
  dashboard:['📊','Dashboard'], stock:['📦','Stock'], menu:['🎨','Menu & colours'], staff:['👥','Staff & PINs'],
  tables:['🪑','Tables'], billing:['🧾','Billing'], bills:['💳','Bills'],
  report:['📈','Day report'], log:['📜','Audit log']
};
function show(t) {
  // menu rows edited but not saved: ask before the tab switch throws them away
  if (tab === 'menu' && t !== 'menu' && dirtyRows().length && !confirm(S.leaveUnsaved(dirtyRows().length))) return;
  $('dirtyBar').hidden = true; document.body.classList.remove('dirty');
  tab = t; clearInterval(dashTimer);
  $('tabs').innerHTML = Object.entries(TABS).map(([k,[ic,v]]) =>
    `<button class="${k===tab?'on':''}" onclick="show('${k}')" ${k===tab?'aria-current="page"':''}><span class="ic">${ic}</span>${v}</button>`).join('');
  // on a phone the strip scrolls sideways: keep the page you're on in view
  $('tabs').querySelector('.on')?.scrollIntoView({ block:'nearest', inline:'center' });
  ({dashboard, stock, menu, staff, tables, billing, bills, report, log})[t]();
}

// ---- dashboard ----
// What is still open right now (from the live tables list): the money on
// tables nobody has closed yet.
async function openMoney() {
  const t = await api('GET','/api/tables').catch(() => null);
  if (!t) return null;
  const open = (t.tables || []).filter(x => x.order);
  return { n: open.length, total: open.reduce((s, x) => s + x.order.total, 0) };
}

// The hero used to be "SALES TODAY" = the value of served plates before
// discount, while the cashier's Bills tab showed what was collected: two
// different "today" numbers with nothing between them. The hero is now
// the money collected (cash + UPI on closed bills — the drawer), and the
// line under it accounts for the rest: what was served, the discounts,
// and what is still open on tables.
async function dashboard() {
  const paint = async () => {
    const [d, open] = await Promise.all([api('GET','/api/admin/dashboard'), openMoney()]);
    if (tab !== 'dashboard') return;
    todayDate = d.date;
    const got = (d.paidCash || 0) + (d.paidOnline || 0);
    $('view').innerHTML = `
      <div class="hero">
        <span class="lbl">${esc(S.collectedToday)}</span>
        <b class="big">${rupees(got)}</b>
        <span class="mut">💵 ${rupees(d.paidCash || 0)} · 📲 ${rupees(d.paidOnline || 0)} · ${esc(S.closedBills(d.ordersClosed))}</span>
        <div class="reco">${esc(S.served)} ${rupees(d.soldTotal)} · ${esc(S.discounts)} −${rupees(d.discountTotal || 0)}${open && open.n ? ' · ' + esc(S.stillOpen(rupees(open.total), open.n)) : ''}</div>
        <span class="mut">${esc(S.refreshes)}</span>
      </div>
      <div class="stats">
        <div class="stat"><span class="lbl">${esc(S.orders)}</span><b>${d.ordersOpened}</b></div>
        <div class="stat amber"><span class="lbl">${esc(S.tablesOpen)}</span><b>${d.ordersOpen}</b></div>
        <div class="stat"><span class="lbl">${esc(S.platesCooking)}</span><b>${d.kitchenPending}</b></div>
        <div class="stat green"><span class="lbl">${esc(S.phonesOnline)}</span><b>${d.devicesOnline}</b></div>
      </div>
      <div class="doors">
        <a class="door" href="/manager">🍽 ${esc(S.openManager)}<small>${esc(S.managerWhat)}</small></a>

let todayDate = '';

// ---- stock ----
// "X is khatam" is the admin action most needed mid-service, and it was
// 1 of 9 controls on each of 49 menu rows. Here it is one big switch per
// dish: tap the row, it saves at once, and the picker on every phone greys
// the dish out (the manager screens re-read the menu every 30s).
async function stock() {
  const m = await api('GET','/api/menu');
  if (tab !== 'stock') return;
  const all = m.menu.flatMap(c => c.items);
  const out = all.filter(i => !i.available).length;
  $('view').innerHTML =
    `<div class="stockhd"><b>${esc(S.outCount(out))}</b><span class="mut">${esc(S.stockHint)}</span></div>` +
    m.menu.filter(c => c.items.length).map(c => `
    <h2>${esc(c.name)}</h2><div class="card stocklist">${c.items.map(i => `
      <label class="stockrow${i.available ? '' : ' off'}" data-id="${i.id}">
        <span class="grow">${esc(i.name)}</span>
        <span class="state">${esc(i.available ? S.inStock : S.outOfStock)}</span>
        <input type="checkbox" class="sw avail" ${i.available ? 'checked' : ''} aria-label="${esc(i.name)}">
      </label>`).join('')}</div>`).join('');
}
// the switch saves itself (the shared "avail" handler below), then this
// repaints the row from whatever the switch ended up as
function paintStockRow(row) {
  const on = row.querySelector('input.avail').checked;
  row.classList.toggle('off', !on);
  row.querySelector('.state').textContent = on ? S.inStock : S.outOfStock;
  document.querySelector('.stockhd b').textContent = S.outCount(document.querySelectorAll('.stockrow.off').length);
}

async function saveItem(id, btn) {
  const row = btn.closest('.row');
  const price = toPaise(row.querySelector('.price').value);
  const name = row.querySelector('.name').value.trim();
  if (!name || price === null) { toast(S.namePriceNeeded, 'bad'); return false; }
  const body = {
    name, price,
    station: row.querySelector('.station').value,
    colour: row.querySelector('input[type=color]').value,
    batchCap: parseInt(row.querySelector('.cap').value) || 0,
    batchAgeMin: parseInt(row.querySelector('.age').value) || 0,
  };
  try {
    await api('PATCH', '/api/admin/menu-items/'+id, body);
    markDirty(row, false);
    btn.textContent = S.saved; setTimeout(() => { if (!row.classList.contains('dirty')) btn.textContent = S.save; }, 1200);
    return true;
  } catch (e) { toast(e.message, 'bad'); return false; }
}

function markDirty(row, on) {
  row.classList.toggle('dirty', on);
  const b = row.querySelector('button.save');
  b.classList.toggle('primary', on);
  b.textContent = on ? S.save + ' •' : S.save;
  const n = dirtyRows().length;
  $('dirtyBar').hidden = !n;
  document.body.classList.toggle('dirty', !!n);
  $('dirtyN').textContent = S.unsaved(n);
}
const dirtyRows = () => [...document.querySelectorAll('#view .row.item.dirty')];
async function saveAll() {
  for (const row of dirtyRows()) await saveItem(Number(row.dataset.id), row.querySelector('button.save'));
}
// any edit in a dish row (except the stock switch, which saves itself)
const onEdit = e => {
  const row = e.target.closest?.('#view .row.item');
  if (row && !e.target.classList.contains('avail')) markDirty(row, true);
};
document.addEventListener('input', onEdit);
document.addEventListener('change', onEdit);
window.addEventListener('beforeunload', e => { if (dirtyRows().length) { e.preventDefault(); e.returnValue = ''; } });

document.addEventListener('change', async e => {
  if (e.target.classList?.contains('avail')) {
    const holder = e.target.closest('[data-id]'), id = holder.dataset.id;
    if (holder.classList.contains('stockrow')) paintStockRow(holder);
    try { await api('PATCH','/api/admin/menu-items/'+id, { available: e.target.checked }); }
    catch (err) { toast(err.message, 'bad'); e.target.checked = !e.target.checked; }
    if (holder.classList.contains('stockrow')) paintStockRow(holder);
  }
});
async function archiveItem(id, name) {

}
async function addCat() {

// ---- bills (settled-bill history) ----
let billsDate = '';
async function bills() {
  const d = await api('GET','/api/bills' + (billsDate ? '?date='+billsDate : ''));
  billsDate = d.date;
  const cashSum = d.bills.reduce((a,b)=>a+b.paidCash,0), onlineSum = d.bills.reduce((a,b)=>a+b.paidOnline,0);
  $('view').innerHTML = `
    <div class="datebar">
      <button onclick="shiftBills(-1)">◀</button><b>${d.date}</b><button onclick="shiftBills(1)">▶</button>
      <button onclick="billsDate='';bills()">today</button>
      <span class="mut">${d.bills.length} bills · 💵 ${rupees(cashSum)} · 📲 ${rupees(onlineSum)}</span>
    </div>
    <div class="card">` + (d.bills.length ? d.bills.map(b => `
      <div class="row" style="cursor:pointer" onclick="toggleBill(this, ${b.orderId})" title="click for items">
        <b style="min-width:44px">#${b.orderNo}</b>
        <span class="grow">${esc(b.customerName || b.tableName)}
          <span class="mut">· ${clock(b.closedAt)} · ${esc(b.closedByName)}${b.customerName?' · '+esc(b.tableName):''}</span></span>
        ${b.discount>0?`<span class="amber" title="${esc(b.discountNote)}">−${rupees(b.discount)}</span>`:''}
        <span class="mut">${b.paidCash>0?'💵 '+rupees(b.paidCash):''} ${b.paidOnline>0?'📲 '+rupees(b.paidOnline):''}</span>
        <b>${rupees(b.total)}</b>
        <button class="icon" onclick="event.stopPropagation();printBill(${b.orderId})">🖨</button>
      </div>
      <div hidden style="padding:4px 8px 10px 52px"></div>`).join('')
    : '<p class="mut">no bills for this day</p>') + `</div>
    <p class="hint">Every closed table's bill lives here — items, discount and how it was paid. 🖨 reprints it.</p>`;
}
// Reprint without leaving the page or putting the session token in a URL
// (it used to window.open('/bill/…?token=…')): fetch the bill with the
// session in a header, print it from a hidden frame.
async function printBill(orderId) {
  let r;
  try { r = await fetch('/bill/' + orderId, { headers: { 'Authorization': 'Bearer ' + token } }); }
  catch (e) { toast('No network — check the internet and try again', 'bad'); return; }
  if (!r.ok) { toast('Could not load the bill to print', 'bad'); return; }
  const html = await r.text();
  $('printFrame')?.remove();
  const f = document.createElement('iframe');
  f.id = 'printFrame'; f.setAttribute('aria-hidden', 'true'); f.tabIndex = -1;
  f.onload = () => {
    try {
      f.style.height = f.contentDocument.documentElement.scrollHeight + 'px';
      f.contentWindow.focus(); f.contentWindow.print();
    } catch (e) { window.print(); }
  };
  f.srcdoc = html;
  document.body.classList.add('has-print');
  document.body.appendChild(f);
}

async function toggleBill(rowEl, orderId) {
  const box = rowEl.nextElementSibling;
  if (!box.hidden) { box.hidden = true; return; }
  const o = await api('GET','/api/orders/'+orderId);
  const items = {};
  o.tickets.forEach(t => t.items.forEach(i => {
    if (i.status === 'cancelled') return;
    const k = i.name + '|' + i.price;
    items[k] = items[k] || { name:i.name, price:i.price, qty:0 };
    items[k].qty += i.qty;
  }));
  box.innerHTML = '<table>' + Object.values(items).map(i =>
    `<tr><td>${i.qty}× ${esc(i.name)}</td><td class="r mut">${rupees(i.price)}</td><td class="r">${rupees(i.qty*i.price)}</td></tr>`).join('') + '</table>';
  box.hidden = false;
}
function shiftBills(days) {
  const t = new Date(billsDate + 'T12:00:00');
  t.setDate(t.getDate() + days);
  billsDate = t.toISOString().slice(0,10);
  bills();
}

let repDate = '';
async function report() {
  const asked = repDate;

  repDate = d.date;
  if (!asked) todayDate = d.date;
  // tables still open count against today only (the live list has no date)
  const open = d.ordersOpen > 0 && d.date === todayDate ? await openMoney() : null;
  const got = (d.paidCash || 0) + (d.paidOnline || 0);
  const lines = (arr, cls) => arr.length
    ? arr.map(l => `<tr><td>${l.qty}× ${esc(l.name)}</td><td class="r ${cls||''}">${rupees(l.value)}</td></tr>`).join('')
    : '<tr><td class="mut">nothing</td><td></td></tr>';
  $('view').innerHTML = `
    <div class="datebar">

      <button onclick="repDate='';report()">today</button>
    </div>
    <div class="stats">
      <div class="stat green"><span class="lbl">sales (served)</span><b>${rupees(d.soldTotal)}</b></div>
      <div class="stat"><span class="lbl">orders</span><b>${d.ordersOpened}</b></div>
      <div class="stat red"><span class="lbl">cancelled</span><b>${rupees(d.cancelledTotal)}</b></div>
    </div>
    <div class="stats" style="margin-top:10px">
      <div class="stat green"><span class="lbl">${esc(S.netCollected)}</span><b>${rupees(got)}</b></div>
      <div class="stat"><span class="lbl">💵 cash in drawer</span><b>${rupees(d.paidCash||0)}</b></div>
      <div class="stat"><span class="lbl">📲 online / UPI</span><b>${rupees(d.paidOnline||0)}</b></div>
      <div class="stat amber"><span class="lbl">discounts given</span><b>${rupees(d.discountTotal||0)}</b></div>
    </div>
    ${d.ordersOpen>0?`<p class="redtx" style="margin-top:10px">⚠ ${d.ordersOpen} order(s) still open for this date${open && open.n ? ' — ' + esc(S.notCollected(rupees(open.total))) : ''}</p>`:''}
    <h2>Sold (served items)</h2><div class="card"><table>${lines(d.sold)}
      <tr><th>TOTAL</th><th class="r green" style="font-size:14px">${rupees(d.soldTotal)}</th></tr></table></div>
    <h2>By waiter</h2><div class="card"><table>${d.waiters.map(w =>
      `<tr><td>${esc(w.name)} <span class="mut">(${w.qty} items)</span></td><td class="r">${rupees(w.value)}</td></tr>`).join('') || '<tr><td class="mut">nothing</td></tr>'}</table></div>
    <h2>Cancelled</h2><div class="card"><table>${lines(d.cancelled,'redtx')}</table>
      ${d.cancelLog.map(c => `<p class="mut" style="margin-top:6px">${clock(c.at)} · ${esc(c.by)}: ${esc(c.detail)}</p>`).join('')}</div>`;
}
function shiftRep(days) {
  const t = new Date(repDate + 'T12:00:00');
  t.setDate(t.getDate() + days);
  repDate = t.toISOString().slice(0,10);
  report();
}

// ---- audit log ----
let logEvents = [], logType = '';
const LOG_TYPES = { '':'All', orders:'Orders', kitchen:'Kitchen', serving:'Serving', cancel:'Cancelled', billing:'Billing', staff:'Staff & logins' };
async function log() {
  const d = await api('GET','/api/admin/audit' + (logType ? '?type='+logType : ''));
  logEvents = d.events; paintLog();
}
function paintLog() {
  $('view').innerHTML = `<div class="pillnav">` + Object.entries(LOG_TYPES).map(([k,v]) =>
    `<button class="${logType===k?'on':''}" onclick="logType='${k}';log()">${v}</button>`).join('') +
    `</div><div class="card">` + (logEvents.length ? logEvents.map(e => `
    <div class="row"><span class="mut" style="min-width:46px">${clock(e.at)}</span>
      <b>${esc(e.by || 'system')}</b><span class="mut">${esc(e.action)}</span>
      <span class="grow">${esc(e.detail)}</span></div>`).join('') : '<p class="mut">nothing in this filter</p>') +
    `</div><button onclick="olderLog()" style="width:100%">Load older</button>`;
}
async function olderLog() {
  if (!logEvents.length) { log(); return; }
  const d = await api('GET','/api/admin/audit?beforeId=' + logEvents[logEvents.length-1].id + (logType ? '&type='+logType : ''));
  logEvents = logEvents.concat(d.events); paintLog();
}

// ---- the session from the PIN pad at "/" ---------------------------------
(function adopt() {
  let t = null, s = null;
  try { t = localStorage.getItem(TOK); s = JSON.parse(localStorage.getItem(WHO) || 'null'); }
  catch (e) { /* corrupt storage: treat as logged out */ }
  if (!t || !s || s.role !== 'admin') { location.replace('/'); return; }
  token = t; me = s;
  $('app').hidden = false;
  $('who').textContent = me.name;
  show('dashboard');
})();
