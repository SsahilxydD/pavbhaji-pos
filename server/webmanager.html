<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#a93307">
<title>PavBhaji POS — Manager</title>
<link rel="stylesheet" href="/pos.css">
</head>
<body>

<div class="top">
  <div class="tile">🍽</div>
  <div class="ttl"><b>Manager</b><small id="who"></small></div>
  <button id="logoutBtn">logout</button>
  <div class="net" id="net" hidden></div>
</div>

<div class="tabs" id="tabs"></div>
<div class="wrap" id="view"></div>
<div id="bar"></div>
<div id="toasts"></div>

<script>
'use strict';
var TOK = 'pbpos.token', WHO = 'pbpos.staff';
var token = localStorage.getItem(TOK) || '';
var me = null;
try { me = JSON.parse(localStorage.getItem(WHO) || 'null'); } catch (e) { me = null; }
// The server enforces the role on every call; this is only so a cashier who
// hand-types /manager gets sent home instead of staring at dead buttons.
if (!token || !me || (me.role !== 'manager' && me.role !== 'admin')) location.replace('/');

// New screen text sits here in one place, so a later EN / हिं / ગુ switch only
// has to swap this table.
var S = {
  noNet: 'Network nahi hai — dobara try karo',
  slowNet: 'Network bahut slow hai — dobara try karo',
  noServer: 'Server se jawab nahi aaya — dobara try karo',
  netDown: '⚠ Net nahi hai · last update ',
  retry: '↻ Dobara try karo',
  retryShort: '↻ Dobara',
  sending: 'Bhej rahe…',
  wait: 'Bhej rahe hain — ek second',
  resend: '↻ Dobara bhejo',
  unsureBar: '⚠ Jawab nahi aaya — ho sakta hai KOT kitchen pahunch gaya ho. ' +
             '"Dobara bhejo" dabao: double KOT nahi banega.',
  locked: 'Pehle ye KOT bhejo — net aate hi "Dobara bhejo" dabao',
  leaveTitle: 'KOT ka jawab nahi aaya',
  leaveBody: 'Ho sakta hai ye KOT kitchen pahunch gaya ho. Chhod ke dobara punch kiya to ' +
             'kitchen do baar bana dega — pehle table pe check karo.',
  stay: 'Ruko',
  leave: 'Chhod do'
};

var $ = function (id) { return document.getElementById(id); };
var esc = function (s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
  });
};
var rupees = function (p) { return p % 100 === 0 ? '₹' + (p / 100) : '₹' + (p / 100).toFixed(2); };
var clock = function (ms) { return new Date(ms).toTimeString().slice(0, 5); };
var uid = function () {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'w' + Date.now() + Math.random().toString(16).slice(2, 12);
};

function toast(msg, kind) {
  // A second tap on a dead network shouldn't stack an identical toast.
  var last = $('toasts').lastElementChild;
  if (last && last.textContent === msg) return;
  var el = document.createElement('div');
  el.className = 'toast' + (kind ? ' ' + kind : '');
  el.textContent = msg;
  $('toasts').appendChild(el);
  setTimeout(function () { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; }, 2600);
  setTimeout(function () { el.remove(); }, 3000);
}

function signOut(silent) {
  if (token && !silent) fetch('/api/logout', { method:'POST', headers:{ 'Authorization':'Bearer ' + token } }).catch(function () {});
  localStorage.removeItem(TOK); localStorage.removeItem(WHO);
  location.replace('/');
}
$('logoutBtn').onclick = function () { confirmLeave(function () { signOut(false); }); };
$('who').textContent = me.name;

// ---------------------------------------------------------------- network
// Phones on shop WiFi or mobile data drop out mid-rush. Every call gives up
// after NET_TIMEOUT and says so in plain words; two misses in a row raise an
// amber strip under the header that stays until the server answers again.
var NET_TIMEOUT = 12000;
var net = { fails: 0, lastOk: Date.now(), probe: null };
var repaint = null;   // the on-screen list's paint(); re-run when the net is back

function netError(msg) { var e = new Error(msg); e.network = true; return e; }

function paintNet(on) {
  $('net').hidden = !on;
  if (on) {
    $('net').innerHTML = '<span>' + esc(S.netDown + clock(net.lastOk)) + '</span>' +
      '<button id="netRetry">' + esc(S.retryShort) + '</button>';
    $('netRetry').onclick = probeNet;
  }
}
function netFail() {
  net.fails++;
  if (net.fails >= 2 || navigator.onLine === false) paintNet(true);
  if (!net.probe) net.probe = setInterval(probeNet, 5000);
}
function netOk() {
  net.fails = 0; net.lastOk = Date.now();
  if (net.probe) { clearInterval(net.probe); net.probe = null; }
  if (!$('net').hidden) {
    paintNet(false);
    if (repaint) repaint().catch(function () {});
  }
}
function probeNet() { api('GET', '/api/ping').catch(function () {}); }
window.addEventListener('offline', function () { netFail(); paintNet(true); });
window.addEventListener('online', probeNet);

async function api(method, path, body) {
  var ctl = window.AbortController ? new AbortController() : null;
  var tm = ctl ? setTimeout(function () { ctl.abort(); }, NET_TIMEOUT) : 0;
  var r;
  try {
    r = await fetch(path, {
      method: method,
      headers: { 'Content-Type':'application/json', 'Authorization':'Bearer ' + token },
      body: body === undefined ? undefined : JSON.stringify(body),
      signal: ctl ? ctl.signal : undefined
    });
  } catch (e) {
    // No HTTP answer at all: offline, a dropped line, or our own timeout.
    // The server may still have acted on a write — callers allow for that.
    netFail();
    throw netError(e && e.name === 'AbortError' ? S.slowNet : S.noNet);
  } finally { clearTimeout(tm); }
  // Caddy answers these itself when the POS server behind it is down.
  if (r.status === 502 || r.status === 503 || r.status === 504) { netFail(); throw netError(S.noServer); }
  netOk();
  if (r.status === 401) { signOut(true); throw new Error('session expired'); }
  var d = await r.json().catch(function () { return {}; });
  if (!r.ok) {
    var e = new Error(d.error || ('server error ' + r.status));
    e.status = r.status; e.blockers = d.blockers;
    throw e;
  }
  return d;
}

function oops(e) { toast(e.message, 'bad'); }

// A list that could not load says why, with a retry, instead of staying blank.
function failView(e, again) {
  $('view').innerHTML = '<div class="empty err-net">⚠ ' + esc(e.message) +
    '<br><button class="ghost" id="againBtn">' + esc(S.retry) + '</button></div>';
  $('againBtn').onclick = again;
}

// ---------------------------------------------------------------- dialogs
var modalUp = false;
function showModal(title, body, buttons) {
  hideModal();
  modalUp = true;
  var m = document.createElement('div');
  m.className = 'modal';
  m.innerHTML = '<div class="box"><h3>' + esc(title) + '</h3>' + body +
    '<div class="btnrow" style="margin-top:14px">' + buttons.map(function (b, i) {
      return '<button class="' + b.cls + '" data-i="' + i + '">' + esc(b.label) + '</button>';
    }).join('') + '</div></div>';
  m.addEventListener('click', function (e) {
    if (e.target === m) { hideModal(); return; }
    var b = e.target.closest('button[data-i]');
    if (!b) return;
    var a = buttons[Number(b.dataset.i)];
    if (a.act) a.act(); else hideModal();
  });
  document.body.appendChild(m);
  return m;
}
function hideModal() {
  modalUp = false;
  var m = document.querySelector('.modal');
  if (m) m.remove();
}

// ---------------------------------------------------------------- state
var tab = 'tables', timer = null, menu = [], openTable = null, parcelMode = false;
// The cart and its idempotency key — the app's contract (data/Api.kt
// sendTicket): cartId is minted with the cart and sent on every retry, the
// server answers a repeated id with the order it already saved, and a new
// id only comes with a new cart. So a lost reply can never punch twice.
// cartLocked = we sent it and never heard back; until a retry gets an
// answer, the cart can't change (a changed cart under the same id would
// lose the change, a new id could cook it twice).
var cart = [], cartId = '', cartLocked = false, sending = false, onSend = null;
function newCart() { cart = []; cartId = uid(); cartLocked = false; }
var sleep = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };

// Leaving a cart whose KOT may already be in the kitchen is how a table gets
// cooked twice, so that one case asks first.
function confirmLeave(go) {
  if (sending) { toast(S.wait); return; }
  if (!cartLocked) { go(); return; }
  showModal(S.leaveTitle, '<div class="mut" style="font-size:14px">' + esc(S.leaveBody) + '</div>',
    [{ label: S.stay, cls: 'ghost' },
     { label: S.leave, cls: 'danger', act: function () { hideModal(); newCart(); go(); } }]);
}
var pane = '';   // 'table' | 'picker' — a late refresh must not yank the picker away
// Bumped on every tab switch. A slow load (up to NET_TIMEOUT offline) that
// finishes after the user has moved on must not start its poll on top of
// the new tab's.
var nav = 0;

var TABS = { tables:['🪑','Tables'], parcel:['🥡','Parcel'], kitchen:['🔥','Kitchen'] };
function paintTabs() {
  $('tabs').innerHTML = Object.keys(TABS).map(function (k) {
    return '<button class="' + (k === tab ? 'on' : '') + '" data-tab="' + k + '">' +
           TABS[k][0] + ' ' + TABS[k][1] + '</button>';
  }).join('');
}
$('tabs').addEventListener('click', function (e) {
  var b = e.target.closest('button[data-tab]');
  if (b) confirmLeave(function () { show(b.dataset.tab); });
});

function show(t) {
  tab = t; clearInterval(timer); repaint = null; nav++; pane = '';
  openTable = null; newCart(); parcelMode = (t === 'parcel');
  $('bar').className = ''; $('bar').innerHTML = '';
  paintTabs();
  ({ tables:tables, parcel:parcel, kitchen:kitchen })[t]();
}

var menuById = {};
async function loadMenu() {
  if (menu.length) return menu;
  var d = await api('GET', '/api/menu');
  menu = d.menu || [];
  menuById = {};
  menu.forEach(function (c) { (c.items || []).forEach(function (it) { menuById[it.id] = it; }); });
  return menu;
}

// ---------------------------------------------------------------- tables
async function tables() {
  var paint = async function () {
    var d = await api('GET', '/api/tables');
    if (tab !== 'tables' || openTable) return;
    var list = (d.tables || []).filter(function (t) { return t.kind !== 'parcel'; });
    var parcels = (d.tables || []).filter(function (t) { return t.kind === 'parcel' && t.order; });
    $('view').innerHTML =
      '<h2>Tables</h2><div class="grid">' + list.map(tableTile).join('') + '</div>' +
      (parcels.length ? '<h2>Chal rahe parcel</h2><div class="grid">' + parcels.map(tableTile).join('') + '</div>' : '');
  };
  var my = nav;
  repaint = paint;
  await paint().catch(function (e) {
    if (my === nav && !openTable) failView(e, function () { show('tables'); });
  });
  if (my === nav) timer = setInterval(function () { paint().catch(function () {}); }, 10000);
}

function tableTile(t) {
  var o = t.order;
  return '<button class="tile-btn' + (o ? ' busy' : '') + '" data-table="' + t.id + '" data-name="' + esc(t.name) + '">' +
    '<span class="nm">' + (t.kind === 'parcel' ? '🥡 ' : '') + esc(t.name) + '</span>' +
    (o
      ? '<span class="sub">#' + o.orderNo + ' · ' + clock(o.openedAt) + ' · ' + o.itemCount + ' plate</span>' +
        (o.pendingCount ? '<span class="sub">⏳ ' + o.pendingCount + ' banna baaki</span>' : '') +
        (o.readyCount ? '<span class="sub">✅ ' + o.readyCount + ' ready</span>' : '') +
        '<span class="amt">' + rupees(o.total) + '</span>'
      : '<span class="sub">khaali</span><span class="amt" style="color:var(--ink3)">—</span>') +
    '</button>';
}

$('view').addEventListener('click', function (e) {
  var t = e.target.closest('button[data-table]');
  if (t) openTableView(Number(t.dataset.table), t.dataset.name).catch(oops);
});

// ------------------------------------------------------- one table's order
// Load first, switch screens after: with no network the grid stays where it
// is and the toast says why, instead of a tap that silently does nothing.
async function openTableView(id, name) {
  var my = nav;
  var d = await api('GET', '/api/dining-tables/' + id + '/order');
  if (my !== nav) return;   // they switched tabs while it loaded
  clearInterval(timer); repaint = null;
  openTable = { id: id, name: name, order: d.order };
  newCart();
  paintTable();
}

// Re-reads the order. Offline it falls back to the copy already on screen,
// so Back from the picker always lands somewhere.
async function refreshTable() {
  var t = openTable;
  try {
    var d = await api('GET', '/api/dining-tables/' + t.id + '/order');
    t.order = d.order;
  } catch (e) { oops(e); }
  if (openTable === t && pane === 'table') paintTable();
}

function paintTable() {
  pane = 'table';
  var o = openTable.order;
  var html = '<div class="row" style="margin-bottom:12px">' +
    '<button class="ghost" id="backBtn" style="min-height:42px;padding:9px 14px">‹ Tables</button>' +
    '<b class="grow" style="font-size:17px;text-align:center">' + esc(openTable.name) + '</b>' +
    '<span style="width:86px"></span></div>';

  if (!o) {
    html += '<div class="empty">Is table pe koi order nahi.<br>Neeche se items add karo.</div>';
  } else {
    html += '<div class="card"><div class="row" style="margin-bottom:6px">' +
      '<b>Order #' + o.orderNo + '</b>' +
      '<span class="right mut">' + clock(o.openedAt) + ' · ' + esc(o.openedByName) + '</span></div>';
    (o.tickets || []).forEach(function (tk) {
      html += '<div class="mut" style="margin:10px 0 2px;font-weight:700">KOT #' + tk.ticketNo + ' · ' + clock(tk.createdAt) + '</div>';
      (tk.items || []).forEach(function (it) {
        html += '<div class="line">' +
          '<span class="qty">' + it.qty + '×</span>' +
          '<span class="grow"><span class="nm">' + esc(it.name) + '</span>' +
          (it.note ? '<div class="note">📝 ' + esc(it.note) + '</div>' : '') +
          (it.cancelReason ? '<div class="note">✕ ' + esc(it.cancelReason) + '</div>' : '') +
          '</span>' +
          '<span class="pill p-' + it.status + '">' + it.status + '</span>' +
          (it.status === 'pending'
            ? '<button class="danger" data-cancel="' + it.id + '" data-nm="' + esc(it.name) + '" style="min-height:38px;padding:8px 11px;font-size:13px">cancel</button>'
            : '') +
          '</div>';
      });
    });
    html += '<div class="row" style="margin-top:12px;padding-top:11px;border-top:1px solid var(--line)">' +
      '<b>Total</b><b class="right tnum">' + rupees(o.total) + '</b></div></div>';
  }

  html += '<button class="primary" id="addBtn" style="width:100%">+ Items add karo</button>';
  $('view').innerHTML = html;
  $('bar').innerHTML = '';
  $('backBtn').onclick = function () { show('tables'); };
  $('addBtn').onclick = function () { picker(openTable.name, sendTicket); };

  $('view').querySelectorAll('button[data-cancel]').forEach(function (b) {
    b.onclick = async function () {
      var reason = prompt('Cancel "' + b.dataset.nm + '" — kyun? (kam se kam 2 akshar)');
      if (reason === null) return;
      try {
        await api('POST', '/api/items/' + b.dataset.cancel + '/cancel', { reason: reason.trim() });
        toast('Cancel ho gaya', 'ok');
        await refreshTable();
      } catch (e) { toast(e.message, 'bad'); }
    };
  });
}

// ---------------------------------------------------------------- picker
async function picker(title, send) {
  clearInterval(timer);
  onSend = send;
  var my = nav;
  try { await loadMenu(); } catch (e) { toast(e.message, 'bad'); return; }
  if (my !== nav) return;
  pane = 'picker';
  var html = '<div class="row" style="margin-bottom:12px">' +
    '<button class="ghost" id="pBack" style="min-height:42px;padding:9px 14px">‹ Back</button>' +
    '<b class="grow" style="font-size:17px;text-align:center">' + esc(title) + '</b>' +
    '<span style="width:86px"></span></div>';
  html += '<div id="pkList">';
  menu.forEach(function (c) {
    html += '<h2>' + esc(c.name) + '</h2><div class="card pk-card">';
    (c.items || []).forEach(function (it) {
      html += '<div class="line pk-row" data-item="' + it.id + '">' +
        '<span class="grow"><span class="nm">' + esc(it.name) + '</span>' +
        '<div class="mut tnum">' + rupees(it.price) + (it.available ? '' : ' · khatam') + '</div></span>' +
        '<span class="step">' +
          '<button data-dec="' + it.id + '" disabled>−</button>' +
          '<b id="q' + it.id + '">0</b>' +
          '<button data-inc="' + it.id + '">+</button>' +
        '</span></div>';
    });
    html += '</div>';
  });
  html += '</div>';
  $('view').innerHTML = html;
  $('pBack').onclick = function () {
    confirmLeave(function () {
      newCart(); paintCartBar();
      if (parcelMode) { show('parcel'); return; }
      paintTable();     // the copy we have, at once — even with no network
      refreshTable();
    });
  };
  // − takes one off; + or a tap anywhere else on the row adds one (the app's
  // MenuRow does the same), so a fat-fingered tap still lands on that dish.
  $('pkList').addEventListener('click', function (e) {
    var row = e.target.closest('.pk-row');
    if (!row) return;
    if (e.target.closest('button[data-dec]')) bump(Number(row.dataset.item), -1);
    else bump(Number(row.dataset.item), 1);
  });
  paintCartBar();
}

function bump(id, delta) {
  if (sending) { toast(S.wait); return; }
  if (cartLocked) { toast(S.locked, 'bad'); return; }
  var it = menuById[id];
  var line = cart.filter(function (l) { return l.menuItemId === id; })[0];
  if (!line) {
    if (delta < 0 || !it) return;
    line = { menuItemId: id, name: it.name, price: it.price, qty: 0, note: '' };
    cart.push(line);
  }
  line.qty += delta;
  if (line.qty <= 0) cart = cart.filter(function (l) { return l.menuItemId !== id; });
  paintRow(id);
  paintCartBar();
}

// One menu row's count, highlight and − state, from the cart.
function paintRow(id) {
  var row = document.querySelector('.pk-row[data-item="' + id + '"]');
  if (!row) return;
  var n = cart.reduce(function (s, l) { return s + (l.menuItemId === id ? l.qty : 0); }, 0);
  $('q' + id).textContent = String(n);
  row.classList.toggle('in', n > 0);
  row.querySelector('button[data-dec]').disabled = n === 0;
}

function cartTotal() {
  return cart.reduce(function (s, l) { return s + l.qty * l.price; }, 0);
}

function paintCartBar() {
  var bar = $('bar');
  if (!cart.length) { bar.className = ''; bar.innerHTML = ''; return; }
  var n = cart.reduce(function (s, l) { return s + l.qty; }, 0);
  var btn = '<button class="primary" id="sendBtn"' + (sending ? ' disabled' : '') + '>';
  if (cartLocked) {
    bar.className = 'bar stack';
    bar.innerHTML = '<div class="unsure">' + esc(S.unsureBar) + '</div>' +
      btn + esc(sending ? S.sending : S.resend + ' · ' + n + ' plate') + '</button>';
  } else {
    bar.className = 'bar';
    bar.innerHTML = '<span class="tot">' + n + ' plate · ' + rupees(cartTotal()) + '</span>' +
      btn + (sending ? esc(S.sending) : 'Kitchen bhejo') + '</button>';
  }
  $('sendBtn').onclick = function () { if (onSend) onSend(); };
}

// Sends the cart under its cartId. No answer, or a 5xx, means the server may
// have saved it: the same id is always safe to send again, so it retries by
// itself twice, then locks the cart and asks for "Dobara bhejo". A 4xx is a
// real "no" (nothing was saved), so the cart stays editable — and the same
// id stays valid, because the server never stored it.
async function sendCart(post, done) {
  if (sending || !cart.length) return;
  sending = true; paintCartBar();
  var id = cartId;
  var items = cart.map(function (l) { return { menuItemId: l.menuItemId, qty: l.qty, note: l.note }; });
  var t0 = Date.now();
  for (var attempt = 1; ; attempt++) {
    try {
      var d = await post(id, items);
      sending = false; newCart(); paintCartBar();
      done(d);
      return;
    } catch (e) {
      var unsure = !!e.network || e.status >= 500;
      if (unsure && attempt < 3 && Date.now() - t0 < 8000) { await sleep(1000 * attempt); continue; }
      sending = false; cartLocked = unsure;
      paintCartBar();
      // Locked: the bar itself explains, and a toast would sit on its button.
      if (!unsure) toast(e.message, 'bad');
      return;
    }
  }
}

async function sendTicket() {
  var t = openTable;
  await sendCart(function (id, items) {
    return api('POST', '/api/dining-tables/' + t.id + '/tickets', { clientTicketId: id, items: items });
  }, function (d) {
    toast('Kitchen ko bhej diya ✓', 'ok');
    if (openTable !== t) return;
    if (d && d.tickets) { t.order = d; paintTable(); }   // the reply is the saved order
    else { paintTable(); refreshTable(); }
  });
}

// ---------------------------------------------------------------- parcel
function parcel() {
  $('view').innerHTML =
    '<h2>Naya parcel</h2><div class="card">' +
    '<label class="fld"><span>Customer ka naam *</span><input id="pcName" maxlength="60" placeholder="naam"></label>' +
    '<label class="fld"><span>Phone (optional)</span><input id="pcPhone" inputmode="tel" maxlength="20" placeholder="98xxxxxxxx"></label>' +
    '<button class="primary" id="pcNext" style="width:100%">Items chuno ›</button></div>' +
    '<p class="hint">Parcel banane ke baad wo Tables screen pe "chal rahe parcel" me dikhega.</p>';
  $('pcNext').onclick = function () {
    var nm = $('pcName').value.trim();
    if (!nm) { toast('Customer ka naam chahiye', 'bad'); return; }
    openTable = { parcelName: nm, parcelPhone: $('pcPhone').value.trim() };
    newCart();
    picker('🥡 ' + nm, sendParcel);
  };
}

async function sendParcel() {
  var t = openTable;
  await sendCart(function (id, items) {
    return api('POST', '/api/parcels', {
      customerName: t.parcelName, customerPhone: t.parcelPhone, clientTicketId: id, items: items
    });
  }, function () {
    toast('Parcel ban gaya ✓', 'ok');
    show('tables');
  });
}

// ---------------------------------------------------------------- kitchen
async function kitchen() {
  var paint = async function () {
    var d = await api('GET', '/api/kitchen');
    if (tab !== 'kitchen') return;
    var bs = d.buckets || [];
    if (!bs.length) { $('view').innerHTML = '<div class="empty">Kitchen khaali hai — kuch pending nahi.</div>'; return; }
    $('view').innerHTML = '<h2>Tawa pe / queue me</h2>' + bs.map(function (b) {
      return '<div class="card"><div class="row" style="margin-bottom:6px">' +
        '<b>' + esc(b.name) + '</b>' +
        '<span class="pill p-' + b.status + '">' + b.status + '</span>' +
        '<span class="right mut tnum">' + b.qty + '/' + (b.cap || d.cap) + '</span></div>' +
        (b.takenByName ? '<div class="mut">👨‍🍳 ' + esc(b.takenByName) + '</div>' : '') +
        (b.lines || []).map(function (l) {
          return '<div class="line"><span class="qty">' + l.qty + '×</span>' +
            '<span class="grow"><span class="nm">' + esc(l.tableName) + '</span>' +
            (l.note ? '<div class="note">📝 ' + esc(l.note) + '</div>' : '') + '</span>' +
            (l.done ? '<span class="pill p-ready">ready</span>' : '') + '</div>';
        }).join('') + '</div>';
    }).join('');
  };
  var my = nav;
  repaint = paint;
  await paint().catch(function (e) {
    if (my === nav) failView(e, function () { show('kitchen'); });
  });
  if (my === nav) timer = setInterval(function () { paint().catch(function () {}); }, 8000);
}

show('tables');
</script>
</body>
</html>
