<script>
'use strict';
var TOK = 'pbpos.token', WHO = 'pbpos.staff';
var token = localStorage.getItem(TOK) || '';
var me = null;
try { me = JSON.parse(localStorage.getItem(WHO) || 'null'); } catch (e) { me = null; }
// The server enforces the role on every call; this is only so a cashier who
// hand-types /manager gets sent home instead of staring at dead buttons.
if (!token || !me || (me.role !== 'manager' && me.role !== 'admin')) location.replace('/');

// ---------------------------------------------------------------- language
// Hinglish (the default — the words this screen always used) / हिं / ગુ.
// Hindi and Gujarati are the app's ui/L10n.kt words wherever it has them.
// The choice is kept in this browser (shared by every screen; a phone that
// already chose हिं or ગુ keeps it) and the page redraws in place, so a
// half-punched cart survives a switch. Not translated, as in the app: dish,
// table and staff names (the owner's data), the note chips (they are what
// the kitchen reads on the KOT) and the server's own error messages.
var LANG_KEY = 'pbpos.lang', LANG_MARK = { hg:'Hinglish', hi:'हिं', gu:'ગુ' };
var lang = 'hg';
try { lang = LANG_MARK[localStorage.getItem(LANG_KEY)] ? localStorage.getItem(LANG_KEY) : 'hg'; } catch (e) {}
function t(hg, hi, gu) { return lang === 'hi' ? hi : lang === 'gu' ? gu : hg; }

var S = {};
function strings() {
  document.documentElement.lang = lang === 'hg' ? 'hi-Latn' : lang;
  S = {
    title: t('Manager', 'मैनेजर', 'મેનેજર'),

    back: t('Back', 'पीछे', 'પાછળ'),

var $ = function (id) { return document.getElementById(id); };

  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
  });
};
// Money is paise on the wire. On screen it is Indian-grouped with no decimals
// for whole rupees — ₹13,660, ₹1,23,456, ₹42.50 — the same as the app.
var INR0 = window.Intl ? new Intl.NumberFormat('en-IN', { maximumFractionDigits: 0 }) : null;
var INR2 = window.Intl ? new Intl.NumberFormat('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : null;
var rupees = function (p) {
  var whole = p % 100 === 0;
  if (!INR0) return '₹' + (whole ? p / 100 : (p / 100).toFixed(2));
  return '₹' + (whole ? INR0 : INR2).format(p / 100);
};
// Clock times read the way the printed bill prints them: "7:42 pm", not a
// 24-hour "19:42". (How long a table has waited is age(), not a clock.)
var clock = function (ms) {
  var d = new Date(ms), h = d.getHours(), m = d.getMinutes();
  return (h % 12 || 12) + ':' + (m < 10 ? '0' : '') + m + ' ' + (h < 12 ? 'am' : 'pm');
};
var uid = function () {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'w' + Date.now() + Math.random().toString(16).slice(2, 12);
};

function toast(msg, kind) {
  // A second tap on a dead network shouldn't stack an identical toast.
  var last = $('toasts').lastElementChild;
  if (last && last.textContent === msg) return;
  var el = document.createElement('div');
  el.className = 'toast' + (kind ? ' ' + kind : '');
  el.textContent = msg;
  $('toasts').appendChild(el);
  setTimeout(function () { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; }, 2600);
  setTimeout(function () { el.remove(); }, 3000);
}

// ---------------------------------------------------------------- network
// Phones on shop WiFi or mobile data drop out mid-rush. Every call gives up
// after NET_TIMEOUT and says so in plain words; two misses in a row raise an
// amber strip under the header that stays until the server answers again.
var NET_TIMEOUT = 12000;
var net = { fails: 0, lastOk: Date.now(), probe: null };
var repaint = null;   // the on-screen list's paint(); re-run when the net is back

function netError(msg) { var e = new Error(msg); e.network = true; return e; }

function paintNet(on) {
  $('net').hidden = !on;
  if (on) {
    $('net').innerHTML = '<span>' + esc(S.netDown + clock(net.lastOk)) + '</span>' +
      '<button id="netRetry">' + esc(S.retryShort) + '</button>';
    $('netRetry').onclick = probeNet;
  }
  syncTop();   // the picker's sticky search sits under the (now taller) header
}
function netFail() {
  net.fails++;
  if (net.fails >= 2 || navigator.onLine === false) paintNet(true);
  if (!net.probe) net.probe = setInterval(probeNet, 5000);
}
function netOk() {
  net.fails = 0; net.lastOk = Date.now();
  if (net.probe) { clearInterval(net.probe); net.probe = null; }
  if (!$('net').hidden) {
    paintNet(false);
    if (repaint) repaint().catch(function () {});
  }
}
function probeNet() { api('GET', '/api/ping').catch(function () {}); }
window.addEventListener('offline', function () { netFail(); paintNet(true); });
window.addEventListener('online', probeNet);

async function api(method, path, body) {
  var ctl = window.AbortController ? new AbortController() : null;
  var tm = ctl ? setTimeout(function () { ctl.abort(); }, NET_TIMEOUT) : 0;
  var r;
  try {
    r = await fetch(path, {
      method: method,
      headers: { 'Content-Type':'application/json', 'Authorization':'Bearer ' + token },
      body: body === undefined ? undefined : JSON.stringify(body),
      signal: ctl ? ctl.signal : undefined
    });
  } catch (e) {
    // No HTTP answer at all: offline, a dropped line, or our own timeout.
    // The server may still have acted on a write — callers allow for that.
    netFail();
    throw netError(e && e.name === 'AbortError' ? S.slowNet : S.noNet);
  } finally { clearTimeout(tm); }
  // Caddy answers these itself when the POS server behind it is down.
  if (r.status === 502 || r.status === 503 || r.status === 504) { netFail(); throw netError(S.noServer); }
  netOk();
  if (r.status === 401) { signOut(true); throw new Error(S.expired); }
  var d = await r.json().catch(function () { return {}; });
  if (!r.ok) {
    var e = new Error(d.error || ('server error ' + r.status));
    e.status = r.status; e.blockers = d.blockers;
    throw e;
  }
  return d;
}

function oops(e) { toast(e.message, 'bad'); }

// A list that could not load says why, with a retry, instead of staying blank.
function failView(e, again) {
  $('view').innerHTML = '<div class="empty err-net">⚠ ' + esc(e.message) +
    '<br><button class="ghost" id="againBtn">' + esc(S.retry) + '</button></div>';
  $('againBtn').onclick = again;
}

// ---------------------------------------------------------------- dialogs
// The sheets sit at the bottom of the screen, which is exactly where an
// iPhone's keyboard opens — over the Save button. visualViewport shrinks by
// the keyboard's height; the sheet is lifted by the same amount (pos.css
// --kb) and never grows taller than what is still visible (--vvh).
function fitKeyboard() {
  var vv = window.visualViewport;
  if (!vv) return;
  var kb = Math.max(0, Math.round(window.innerHeight - vv.height - vv.offsetTop));
  document.documentElement.style.setProperty('--kb', kb + 'px');
  document.documentElement.style.setProperty('--vvh', Math.round(vv.height) + 'px');
}
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', fitKeyboard);
  window.visualViewport.addEventListener('scroll', fitKeyboard);
  fitKeyboard();
}

var modalUp = false;
function showModal(title, body, buttons) {
  hideModal();
  modalUp = true;
  var m = document.createElement('div');
  m.className = 'modal';
  m.innerHTML = '<div class="box"><h3>' + esc(title) + '</h3>' + body +
    '<div class="btnrow" style="margin-top:14px">' + buttons.map(function (b, i) {
      return '<button class="' + b.cls + '" data-i="' + i + '">' + esc(b.label) + '</button>';
    }).join('') + '</div></div>';
  m.addEventListener('click', function (e) {
    if (e.target === m) { hideModal(); return; }
    var b = e.target.closest('button[data-i]');
    if (!b) return;
    var a = buttons[Number(b.dataset.i)];
    if (a.act) a.act(); else hideModal();
  });
  document.body.appendChild(m);
  return m;
}
function hideModal() {
  modalUp = false;
  var m = document.querySelector('.modal');
  if (m) m.remove();
}

// Keyboard, for a laptop. In a sheet: Esc does what its first button
// (Back / Keep / Stay) does; Enter presses the main button — Save, Send to
// kitchen — but never a red one (Discard, Cancel item), which wants a
// deliberate click. In the picker, "/" jumps to the search box, so nobody
// has to Tab through a hundred − / + buttons.
document.addEventListener('keydown', function (e) {
  if (e.ctrlKey || e.metaKey || e.altKey || e.isComposing) return;
  var tg = e.target.tagName;
  if (modalUp) {
    var m = document.querySelector('.modal');
    if (!m) return;
    var btns = m.querySelectorAll('.btnrow button[data-i]');
    if (e.key === 'Escape') { e.preventDefault(); if (btns[0]) btns[0].click(); else hideModal(); }
    else if (e.key === 'Enter' && tg !== 'BUTTON' && tg !== 'TEXTAREA') {
      var main = btns[btns.length - 1];
      if (main && /\b(primary|okbtn)\b/.test(main.className) && !main.disabled) { e.preventDefault(); main.click(); }
    }
    return;
  }
  if (e.key === '/' && pane === 'picker' && $('pkQ') && tg !== 'INPUT' && tg !== 'TEXTAREA' && tg !== 'SELECT') {
    e.preventDefault();
    $('pkQ').focus();
  }
});

// ---------------------------------------------------------------- state
var tab = 'tables', timer = null, menu = [], openTable = null, parcelMode = false;
// The cart and its idempotency key — the app's contract (data/Api.kt
// sendTicket): cartId is minted with the cart and sent on every retry, the
// server answers a repeated id with the order it already saved, and a new
// id only comes with a new cart. So a lost reply can never punch twice.
// cartLocked = we sent it and never heard back; until a retry gets an
// answer, the cart can't change (a changed cart under the same id would
// lose the change, a new id could cook it twice).
var cart = [], cartId = '', cartLocked = false, sending = false, onSend = null;
function newCart() { cart = []; cartId = uid(); cartLocked = false; }
var sleep = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };

// Leaving a cart whose KOT may already be in the kitchen is how a table gets
// cooked twice, so that case asks first. So does leaving a cart that hasn't
// gone yet (the app's "Discard 3 items not sent yet?"): Back or logout used
// to drop it without a word.
function confirmLeave(go) {
  if (sending) { toast(S.wait); return; }
  if (cartLocked) {
    showModal(S.leaveTitle, '<div class="mut" style="font-size:14px">' + esc(S.leaveBody) + '</div>',
      [{ label: S.stay, cls: 'ghost' },
       { label: S.leave, cls: 'danger', act: function () { hideModal(); newCart(); go(); } }]);
    return;
  }
  if (!cart.length) { go(); return; }
  showModal(S.discardQ(S.items(cartPlates())), '<div class="mut" style="font-size:14px">' + esc(S.discardBody) + '</div>',
    [{ label: S.keep, cls: 'ghost' },
     { label: S.discard, cls: 'danger', act: function () { hideModal(); newCart(); go(); } }]);
}
// A reload or a closed tab would lose it too: let the browser ask.
window.addEventListener('beforeunload', function (e) {
  if (cart.length) { e.preventDefault(); e.returnValue = ''; }
});

// The menu is re-read every time the picker opens (and every 30s while it is
// open), because "khatam" changes mid-service and one khatam dish in a KOT
// makes the server refuse the whole KOT. Offline, the last copy is used.
// A dish that vanished from the menu is kept as unavailable, so a cart line
// that still points at it can be shown and taken out.
var menuById = {};
async function loadMenu() {
  try {
    var d = await api('GET', '/api/menu');
    menu = d.menu || [];
  } catch (e) {
    if (!menu.length) throw e;
    return menu;
  }
  var fresh = {};
  menu.forEach(function (c) { (c.items || []).forEach(function (it) { fresh[it.id] = it; }); });
  Object.keys(menuById).forEach(function (k) {
    if (!fresh[k]) fresh[k] = Object.assign({}, menuById[k], { available: false });
  });
  menuById = fresh;
  return menu;
}

// ---------------------------------------------------------------- tables
async function tables() {
  var paint = async function () {
    var d = await api('GET', '/api/tables');
    if (tab !== 'tables' || openTable || pane === 'inventory') return;
    var list = (d.tables || []).filter(function (t) { return t.kind !== 'parcel'; });
    var parcels = (d.tables || []).filter(function (t) { return t.kind === 'parcel' && t.order; });
    // The room at a glance, in the header (the app's "9 of 24 occupied").
    var busy = list.filter(function (t) { return t.order; }).length;
    var ready = (d.tables || []).reduce(function (s, t) { return s + (t.order ? t.order.readyCount : 0); }, 0);
    // (the counts first: on a narrow phone the name is what gets cut)
    $('who').textContent = S.occupied(busy, list.length) + (ready ? ' · ' + S.readyN(ready) : '') + ' · ' + me.name;
    // Running parcels are few and time-critical: they go on top, not after
    // all 24 tables.
    $('view').innerHTML = invEntry() +
      (parcels.length ? '<h2>🥡 ' + esc(S.runningParcels) + '</h2><div class="grid">' + parcels.map(tableTile).join('') + '</div>' : '') +
      '<h2>' + esc(S.tabTables) + '</h2><div class="grid">' + list.map(tableTile).join('') + '</div>';
    if (window.PBInventory) PBInventory.peek(api);
  };
  var my = nav;
  repaint = paint;
  await paint().catch(function (e) {
    if (my === nav && !openTable) failView(e, function () { show('tables'); });
  });
  if (my === nav) timer = setInterval(function () { paint().catch(function () {}); }, 10000);
}

// A dish's bucket colour (#RRGGBB set in admin), or the app's stable pick
// from its palette when none is set (Theme.kt dishColour).
var DISH_PALETTE = ['#E8483F', '#FFC93D', '#FF8A3D', '#6FCF6F', '#C79BFF', '#5BC8DB'];
function dishColour(hex, id) {
  if (/^#[0-9a-fA-F]{6}$/.test(String(hex || '').trim())) return String(hex).trim();
  var n = DISH_PALETTE.length;
  return DISH_PALETTE[(((Number(id) || 0) % n) + n) % n];
}

// "now", "6m", "1h20m" since the order opened — the app's ageMinutes.
function age(ms) {
  var m = Math.max(0, Math.floor((Date.now() - ms) / 60000));
  return m < 1 ? S.now : m < 60 ? m + 'm' : Math.floor(m / 60) + 'h' + (m % 60) + 'm';
}

// One table, coloured by what to do next (the app's TableCard): free,
// in the kitchen, plates ready to pick up, or all served — collect.
function tableTile(t) {
  var o = t.order;
  var attrs = ' data-table="' + t.id + '" data-name="' + esc(t.name) + '" data-kind="' + esc(t.kind) + '" data-free="' + (o ? '' : '1') + '"';
  if (!o) {
    return '<button class="tile-btn free"' + attrs + '><span class="nm">' + esc(t.name) + '</span>' +
      '<span class="sub">' + esc(S.free) + '</span></button>';
  }
  var state = o.readyCount > 0 ? 'ready' : o.pendingCount > 0 ? 'cook' : 'collect';
  var pill = state === 'ready' ? S.readyPickup(o.readyCount)
           : state === 'cook' ? S.inKitchen : S.collectAmt(rupees(o.total));
  return '<button class="tile-btn ' + state + '"' + attrs + '>' +
    '<span class="hd"><span class="nm">' + (t.kind === 'parcel' ? '🥡 ' : '') + esc(t.name) + '</span>' +
      '<span class="no">#' + o.orderNo + '</span></span>' +
    '<span class="money">' + rupees(o.total) + ' · ' + esc(S.items(o.itemCount)) + '</span>' +
    '<span class="meta"><span class="who">' + esc('⏱ ' + age(o.openedAt) + ' · ' + (o.customerName || o.openedByName)) + '</span>' +
      '<span class="spill ' + state + '">' + esc(pill) + '</span></span>' +

}

// ------------------------------------------------------- one table's order
// Load first, switch screens after: with no network the grid stays where it
// is and the toast says why, instead of a tap that silently does nothing.
async function openTableView(id, name, kind) {
  var my = nav;
  var d = await api('GET', '/api/dining-tables/' + id + '/order');
  if (my !== nav) return;   // they switched tabs while it loaded
  clearInterval(timer); repaint = null;
  openTable = { id: id, name: name, kind: kind || 'dine', order: d.order };
  newCart(); parcelMode = false;   // a running parcel opened from the Parcel tab is a table like any other
  // A free table has nothing to look at yet: the most common tap of the
  // night goes straight to the menu (Back from there returns to the grid).
  if (!d.order) {
    // (if even the menu can't load, put the live grid back rather than
    // leave a stale one with its poll stopped)
    if (!(await picker(name, sendTicket)) && my === nav) show(tab);
    return;

// Re-reads the order. Offline it falls back to the copy already on screen,
// so Back from the picker always lands somewhere.
// quiet = the background poll: a miss there shows on the amber net strip,
// not as a toast every 8 seconds.
async function refreshTable(quiet) {
  var t = openTable;
  try {
    var d = await api('GET', '/api/dining-tables/' + t.id + '/order');
    t.order = d.order;
  } catch (e) { if (!quiet) oops(e); return; }
  if (openTable === t && pane === 'table' && !(quiet && modalUp)) paintTable();
}

function paintTable() {
  pane = 'table'; clearInterval(timer);   // the picker's menu poll, if we came from there
  // The order keeps itself fresh while it is on screen: PENDING turns READY
  // as the kitchen ticks it, without leaving and coming back. (Skips a round
  // while the cancel sheet is open, so the reason being typed survives.)
  timer = setInterval(function () {
    if (pane === 'table' && !modalUp) refreshTable(true);
  }, 8000);
  var o = openTable.order;
  $('tabs').hidden = true;
  setTop('‹', openTable.name,
    o ? S.orderNo(o.orderNo) + ' · ' + rupees(o.total) + ' · ' + o.openedByName : S.newOrder,
    function () { show(tab); });   // back to the tab it was opened from (Tables or Parcel)
  var html = '';

  if (!o) {
    html += '<div class="empty">' + esc(S.noOrder) + '</div>';
  } else {
    html += '<div class="card"><div class="row" style="margin-bottom:6px">' +
      '<b>' + esc(S.orderNo(o.orderNo)) + '</b>' +
      '<span class="right mut">' + clock(o.openedAt) + ' · ' + esc(o.openedByName) + '</span></div>';
    (o.tickets || []).forEach(function (tk) {
      // Each KOT is its own block: its last line has no rule under it, so
      // the card no longer ends on a double line above the total.
      html += '<div class="kot"><div class="mut" style="margin:10px 0 2px;font-weight:700">KOT ' + tk.ticketNo + ' · ' + clock(tk.createdAt) + '</div>';
      (tk.items || []).forEach(function (it) {
        // a cancelled line is struck through and greyed — it isn't on the bill
        html += '<div class="line' + (it.status === 'cancelled' ? ' gone' : '') + '">' +
          '<span class="qty">' + it.qty + '×</span>' +
          '<span class="grow"><span class="nm">' + esc(it.name) + '</span>' +
          '<div class="mut tnum lamt">' + rupees(it.qty * it.price) + '</div>' +
          (it.note ? '<div class="note">📝 ' + esc(it.note) + '</div>' : '') +
          (it.cancelReason ? '<div class="note">✕ ' + esc(it.cancelReason) + '</div>' : '') +
          '</span>' +
          '<span class="pill p-' + it.status + '">' + esc(S.status(it.status)) + '</span>' +
          // as in the app and the server: a manager cancels a line the
          // kitchen hasn't started; an admin anything not yet served
          (it.status === 'pending' || (me.role === 'admin' && (it.status === 'preparing' || it.status === 'ready'))
            ? '<button class="danger" data-cancel="' + it.id + '" style="min-height:44px;padding:8px 11px;font-size:13px">' + esc(S.cancel) + '</button>'
            : '') +
          '</div>';
      });
      html += '</div>';
    });
    html += '<div class="row" style="margin-top:12px;padding-top:11px;border-top:1px solid var(--line)">' +
      '<b>' + esc(S.total) + '</b><b class="right tnum">' + rupees(o.total) + '</b></div></div>';
  }

  html += '<button class="primary" id="addBtn" style="width:100%">' + esc(S.addItems) + '</button>';
  // The customers got up and sat somewhere else: the whole order follows
  // them. Dine-in tables only (a parcel slot isn't a seat).
  var movable = o && openTable.kind === 'dine';
  if (movable) html += '<button class="ghost" id="moveBtn" style="width:100%;margin-top:10px">' + esc(S.moveBtn) + '</button>';
  $('view').innerHTML = html;
  $('bar').className = ''; $('bar').innerHTML = '';
  $('addBtn').onclick = function () { picker(openTable.name, sendTicket); };
  if (movable) $('moveBtn').onclick = function () { askMove().catch(oops); };

  $('view').querySelectorAll('button[data-cancel]').forEach(function (b) {
    b.onclick = function () { askCancel(Number(b.dataset.cancel)); };
  });
}

// Changing table: every other dine-in table in one sheet. A free one takes
// the order as it is; an occupied one means joining the two into one order
// and one bill, which gets its own confirm (the server refuses it otherwise).
async function askMove() {
  var from = openTable;
  if (!from.order) return;
  var d = await api('GET', '/api/tables');
  if (openTable !== from || pane !== 'table') return;
  var list = (d.tables || []).filter(function (t) { return t.kind === 'dine' && t.id !== from.id; });
  var m = showModal(S.moveQ(from.name),
    '<div class="hint" style="margin:0 0 12px">' + esc(S.moveHint) + '</div>' +
    '<div class="mvgrid">' + list.map(function (t) {
      return '<button class="tile-btn ' + (t.order ? 'cook' : 'free') + '" data-to="' + t.id + '">' +
        '<span class="nm">' + esc(t.name) + '</span>' +
        '<span class="sub">' + esc(t.order ? S.mergeTag(t.order.orderNo) : S.free) + '</span></button>';
    }).join('') + '</div>',
    [{ label: S.back, cls: 'ghost' }]);
  m.querySelector('.mvgrid').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-to]');
    var to = b && list.filter(function (t) { return t.id === Number(b.dataset.to); })[0];
    if (to) confirmMove(from, to);
  });
}

function confirmMove(from, to) {
  var merge = !!to.order;
  showModal(merge ? S.mergeQ(from.name, to.name) : from.name + ' → ' + to.name + '?',
    '<div>' + esc(merge ? S.mergeBody(to.name, to.order.orderNo) : S.moveBody(from.order.orderNo, to.name)) + '</div>',
    [{ label: S.back, cls: 'ghost' },
     { label: merge ? S.mergeBtn : S.moveGo, cls: 'primary', act: async function () {
        hideModal();
        try {
          var d = await api('POST', '/api/orders/' + from.order.id + '/move', { toTableId: to.id, merge: merge });
          if (openTable !== from) return;
          openTable = { id: d.tableId, name: d.tableName, kind: 'dine', order: d };
          paintTable();
          toast(merge ? S.mergedToast(d.tableName) : S.movedToast(d.tableName), 'ok');
        } catch (e) { toast(e.message, 'bad'); refreshTable(true); }
     } }]);
}

// Cancelling a line: a sheet (the app's ReasonDialog) with one-tap reasons
// instead of the browser's tiny prompt(). The reason goes in the audit log,
// so it is required, and checked here the way the server counts it.
function askCancel(itemId) {
  var it = null;
  ((openTable.order || {}).tickets || []).forEach(function (tk) {
    (tk.items || []).forEach(function (x) { if (x.id === itemId) it = x; });
  });
  if (!it) return;
  var reasons = S.cancelReasons;
  var m = showModal(S.cancelQ(it.qty, it.name),
    '<div class="hint" style="margin:0 0 10px">' + esc(S.reasonRequired) + '</div>' +
    '<div class="nchips">' + reasons.map(function (r, i) {
      return '<button class="nchip" data-r="' + i + '">' + esc(r) + '</button>';
    }).join('') + '</div>' +
    '<input id="mReason" maxlength="120" autocomplete="off" placeholder="' + esc(S.reason) + '">',
    [{ label: S.back, cls: 'ghost' },
     { label: S.cancelItem, cls: 'danger', act: async function () {
        var reason = $('mReason').value.replace(/\s+/g, ' ').trim();
        if (noteBytes(reason) < 2) { toast(S.reasonRequired, 'bad'); $('mReason').focus(); return; }
        hideModal();
        try {
          await api('POST', '/api/items/' + itemId + '/cancel', { reason: reason });
          toast(S.cancelled, 'ok');
          await refreshTable();
        } catch (e) { toast(e.message, 'bad'); }
     } }]);
  m.querySelector('.nchips').addEventListener('click', function (e) {
    var c = e.target.closest('.nchip');
    if (!c) return;
    $('mReason').value = reasons[Number(c.dataset.r)];
    m.querySelectorAll('.nchip').forEach(function (x) { x.classList.toggle('on', x === c); });
  });
}

// ---------------------------------------------------------------- picker
var pickTitle = '';
function pickerTop() {
  setTop('‹', pickTitle, S.pickSub, pickerBack);
}
function pickerBack() {
  confirmLeave(function () {
    newCart(); paintCartBar();
    // a new parcel: back to its form, name and phone still filled in
    if (parcelMode) { show('parcel'); return; }
    // came straight from a free tile: back to the grid, not an empty table
    if (!openTable.order) { show(tab); return; }
    paintTable();     // the copy we have, at once — even with no network
    refreshTable();
  });
}

async function picker(title, send) {
  clearInterval(timer);
  onSend = send;
  var my = nav;
  try { await loadMenu(); } catch (e) { toast(e.message, 'bad'); return false; }
  if (my !== nav) return true;
  pane = 'picker';
  pickTitle = title;
  $('tabs').hidden = true;   // no tab to fat-finger away from a cart
  pickerTop();
  // Finding a dish: a search box and one chip per category, stuck under the
  // header so they're there at any scroll depth.
  var cats = menu.filter(function (c) { return (c.items || []).length; });
  var html = '<div class="pk-tools" id="pkTools">' +
    '<input id="pkQ" type="search" enterkeyhint="search" autocomplete="off" title="/" aria-keyshortcuts="/" placeholder="' + esc(S.search) + '">' +
    '<button id="pkClear" hidden aria-label="clear">✕</button>' +
    '<div class="pk-chips" id="pkChips">' + cats.map(function (c) {
      return '<button data-cat="' + c.id + '">' + esc(c.name) + '</button>';
    }).join('') + '</div></div>';
  html += '<div id="pkList">';
  cats.forEach(function (c) {
    // khatam dishes sink to the bottom of their category (order kept otherwise)
    var items = c.items.filter(function (it) { return it.available; })
      .concat(c.items.filter(function (it) { return !it.available; }));
    html += '<section class="pk-cat" data-cat="' + c.id + '"><h2>' + esc(c.name) + '</h2><div class="card pk-card">';
    items.forEach(function (it) {
      html += '<div class="line pk-row' + (it.available ? '' : ' off') + '" data-item="' + it.id + '"' +
        ' data-q="' + esc(normName(it.name)) + '">' +
        '<span class="grow"><span class="nm">' + esc(it.name) + '</span>' +
        '<div class="mut tnum pk-sub">' + rowSub(it) + '</div></span>' +
        '<span class="step">' +
          '<button data-dec="' + it.id + '" disabled>−</button>' +
          '<b id="q' + it.id + '">0</b>' +
          '<button data-inc="' + it.id + '"' + (it.available ? '' : ' disabled') + '>+</button>' +
        '</span></div>';
    });
    html += '</div></section>';
  });
  html += '<div class="empty" id="pkNone" hidden>' + esc(S.noMatch) + '</div></div>';
  $('view').innerHTML = html;
  window.scrollTo(0, 0);   // start at the top of the menu, not where the order view was
  syncTop();
  markChip(cats.length ? cats[0].id : null);
  $('pkQ').addEventListener('input', filterMenu);
  $('pkQ').addEventListener('keydown', function (e) { if (e.key === 'Enter') this.blur(); });
  $('pkClear').onclick = function () { $('pkQ').value = ''; filterMenu(); };
  $('pkChips').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-cat]');
    if (b) jumpTo(b.dataset.cat);
  });
  timer = setInterval(menuPoll, 30000);
  // − takes one off; + or a tap anywhere else on the row adds one (the app's
  // MenuRow does the same), so a fat-fingered tap still lands on that dish.
  $('pkList').addEventListener('click', function (e) {
    var row = e.target.closest('.pk-row');
    if (!row) return;
    if (e.target.closest('button[data-dec]')) bump(Number(row.dataset.item), -1);
    else bump(Number(row.dataset.item), 1);
  });
  paintCartBar();
  return true;
}

// "Sp. Pulav" -> "sp pulav", so "sp pul" or "pulav sp" both find it.
function normName(s) {
  return String(s).toLowerCase().replace(/[.,()\/&+\-]+/g, ' ').replace(/\s+/g, ' ').trim();
}

// Every word typed must appear somewhere in the dish name.
function filterMenu() {
  var q = normName($('pkQ').value), words = q ? q.split(' ') : [];
  $('pkTools').classList.toggle('q', !!q);
  $('pkClear').hidden = !q;
  var any = false;
  document.querySelectorAll('#pkList .pk-cat').forEach(function (sec) {
    var shown = 0;
    sec.querySelectorAll('.pk-row').forEach(function (r) {
      var hit = words.every(function (w) { return r.dataset.q.indexOf(w) >= 0; });
      r.hidden = !hit;
      if (hit) shown++;
    });
    sec.hidden = !shown;
    if (shown) any = true;
  });
  $('pkNone').hidden = any;
  if (q) window.scrollTo(0, 0);
}

// The sticky bits sit under the header, whose height changes with the
// offline strip and the phone's safe area.
function syncTop() {
  document.documentElement.style.setProperty('--top-h', document.querySelector('.top').offsetHeight + 'px');
}
window.addEventListener('resize', syncTop);

function jumpTo(catId) {
  var sec = document.querySelector('.pk-cat[data-cat="' + catId + '"]');
  if (!sec) return;
  var off = document.querySelector('.top').offsetHeight + $('pkTools').offsetHeight + 4;
  window.scrollTo(0, sec.getBoundingClientRect().top + window.pageYOffset - off);
  markChip(catId);
}

function markChip(catId) {
  var box = $('pkChips');
  if (!box) return;
  box.querySelectorAll('button').forEach(function (b) {
    var on = b.dataset.cat === String(catId);
    b.classList.toggle('on', on);
    if (on && (b.offsetLeft < box.scrollLeft || b.offsetLeft + b.offsetWidth > box.scrollLeft + box.clientWidth)) {
      box.scrollLeft = b.offsetLeft - 8;
    }
  });
}

// Light the chip of the category being looked at.
var spyQueued = false;
window.addEventListener('scroll', function () {
  if (spyQueued || pane !== 'picker' || !$('pkTools')) return;
  spyQueued = true;
  requestAnimationFrame(function () {
    spyQueued = false;
    if (pane !== 'picker' || !$('pkTools')) return;
    var line = $('pkTools').getBoundingClientRect().bottom + 12, cur = null;
    // at the very bottom the last category can't scroll up to the line
    var atEnd = window.innerHeight + window.pageYOffset >= document.documentElement.scrollHeight - 4;
    document.querySelectorAll('#pkList .pk-cat').forEach(function (sec) {
      if (!sec.hidden && (cur === null || atEnd || sec.getBoundingClientRect().top <= line)) cur = sec.dataset.cat;
    });
    markChip(cur);
  });
}, { passive: true });

function bump(id, delta) {
  if (sending) { toast(S.wait); return; }
  if (cartLocked) { toast(S.locked, 'bad'); return; }
  var it = menuById[id];
  if (delta > 0 && it && !it.available) { toast(S.isKhatam(it.name), 'bad'); return; }
  // Like the app, a cart line is one dish + one note. A tap adds to the
  // dish's plain (no-note) line, so "1 Jain + 1 normal" is: tap, note
  // "Jain" on that line, tap again. − takes from the plain line first.
  var mine = cart.filter(function (l) { return l.menuItemId === id; });
  var line = mine.filter(function (l) { return !l.note; })[0];
  if (delta < 0) line = line || mine[mine.length - 1];
  if (!line) {
    if (delta < 0 || !it) return;
    line = { menuItemId: id, name: it.name, price: it.price, qty: 0, note: '' };
    cart.push(line);
  }
  line.qty += delta;
  if (line.qty <= 0) cart.splice(cart.indexOf(line), 1);
  paintRow(id);
  paintCartBar();
}

// The line under a dish name: price, KHATAM when out of stock, and the
// notes already on its cart lines.
function rowSub(it) {
  var notes = cart.filter(function (l) { return l.menuItemId === it.id && l.note; })
    .map(function (l) { return l.qty + '× ' + l.note; });
  return rupees(it.price) +
    (it.available ? '' : ' <span class="pill p-off">' + esc(S.khatam) + '</span>') +
    (notes.length ? ' · <span class="note">📝 ' + esc(notes.join(' · ')) + '</span>' : '');
}

// Stock changed under an open picker: grey out / bring back rows in place.
// No re-sort here — a row jumping away under a thumb is worse than an
// out-of-order one.
function applyStock() {
  document.querySelectorAll('.pk-row').forEach(function (row) {
    var it = menuById[Number(row.dataset.item)];
    if (!it) return;
    row.classList.toggle('off', !it.available);
    row.querySelector('button[data-inc]').disabled = !it.available;
    row.querySelector('.pk-sub').innerHTML = rowSub(it);
  });
}

// Language switched mid-punch: re-word the picker in place (rows, counts,
// search text and scroll stay put).
function paintPickerText() {
  pickerTop();
  $('pkQ').placeholder = S.search;
  $('pkNone').textContent = S.noMatch;
  applyStock();
  paintCartBar();
}

function menuPoll() {
  var a = document.activeElement;
  if (pane !== 'picker' || modalUp || sending || (a && a.tagName === 'INPUT')) return;
  var before = menuById;
  loadMenu().then(function () {
    if (pane !== 'picker') return;
    applyStock();
    cart.forEach(function (l) {
      var was = before[l.menuItemId], now = menuById[l.menuItemId];
      if (was && was.available && now && !now.available) toast(S.wentKhatam(l.name), 'bad');
    });
  }).catch(function () {});
}

// Cart lines the menu now says are out of stock. The server refuses the
// WHOLE KOT for any one of them, so offer to take them out and send the rest.
function offerDropKhatam() {
  var bad = cart.filter(function (l) { var it = menuById[l.menuItemId]; return !it || !it.available; });
  if (!bad.length) return false;
  var left = cart.length > bad.length;
  showModal(S.khatamTitle,
    '<div style="font-size:15px;font-weight:700">• ' +
      bad.map(function (l) { return esc(l.qty + '× ' + l.name); }).join('<br>• ') + '</div>' +
    '<div class="hint">' + esc(left ? S.khatamHint : S.khatamHintAll) + '</div>',
    [{ label: S.back, cls: 'ghost' },
     { label: left ? S.dropAndSend : S.drop, cls: 'primary', act: function () {
        hideModal();
        cart = cart.filter(function (l) { return bad.indexOf(l) < 0; });
        bad.forEach(function (l) { paintRow(l.menuItemId); });
        paintCartBar();
        if (cart.length && onSend) onSend();
     } }]);
  return true;
}

// One menu row's count, highlight, − state and note line, from the cart.
function paintRow(id) {
  var row = document.querySelector('.pk-row[data-item="' + id + '"]');
  if (!row) return;
  var n = cart.reduce(function (s, l) { return s + (l.menuItemId === id ? l.qty : 0); }, 0);
  $('q' + id).textContent = String(n);
  row.classList.toggle('in', n > 0);
  row.querySelector('button[data-dec]').disabled = n === 0;
  if (menuById[id]) row.querySelector('.pk-sub').innerHTML = rowSub(menuById[id]);
}

function cartTotal() {
  return cart.reduce(function (s, l) { return s + l.qty * l.price; }, 0);
}
function cartPlates() {
  return cart.reduce(function (s, l) { return s + l.qty; }, 0);
}

function paintCartBar() {
  var bar = $('bar');
  if (!cart.length) { bar.className = ''; bar.innerHTML = ''; return; }
  var n = cartPlates();
  // While it goes: a turning ring and "Bhej rahe…", not just a greyed button.
  var btn = '<button class="primary' + (sending ? ' busy' : '') + '" id="sendBtn"' + (sending ? ' disabled aria-busy="true"' : '') + '>';
  var busyLabel = '<span class="spin" aria-hidden="true"></span>' + esc(S.sending);
  if (cartLocked) {
    bar.className = 'bar stack';
    bar.innerHTML = '<div class="unsure">' + esc(S.unsureBar) + '</div>' +
      btn + (sending ? busyLabel : esc(S.resend + ' · ' + S.items(n))) + '</button>';
  } else {
    // The left half opens the cart: every line, its note, its count.
    bar.className = 'bar';
    bar.innerHTML = '<button class="ghost cartbtn" id="cartBtn">' +
        '<b>' + esc(S.items(n)) + ' · ' + rupees(cartTotal()) + '</b><small>' + esc(S.cartHint) + '</small></button>' +
      btn + (sending ? busyLabel : esc(S.sendKitchen)) + '</button>';
    $('cartBtn').onclick = openCart;
  }
  $('sendBtn').onclick = function () { if (onSend) onSend(); };
}

// ---------------------------------------------------------------- cart + notes
// The cart sheet: one row per cart line with its own count and note, the
// app's "NEW KOT — NOT SENT YET" block (TableOrderScreen.kt). The note is
// what the kitchen sees on the KOT: "Jain", "kam teekha", "बिना प्याज़"…
function openCart() {
  if (!cart.length) { hideModal(); return; }
  var body = '<div class="cart-ls">' + cart.map(function (l, i) {
    var it = menuById[l.menuItemId], off = !it || !it.available;
    return '<div class="line">' +
      '<span class="grow"><span class="nm">' + esc(l.name) + '</span>' +
        '<div class="mut tnum">' + rupees(l.price) +
          (off ? ' <span class="pill p-off">' + esc(S.khatam) + '</span>' : '') + '</div>' +
        '<button class="notebtn' + (l.note ? ' has' : '') + '" data-note="' + i + '">📝 ' +
          esc(l.note || S.addNote) + '</button></span>' +
      '<span class="step"><button data-cdec="' + i + '">−</button><b>' + l.qty + '</b>' +
        '<button data-cinc="' + i + '"' + (off ? ' disabled' : '') + '>+</button></span>' +
      '</div>';
  }).join('') + '</div>';
  var m = showModal(S.cartTitle, body,
    [{ label: S.back, cls: 'ghost' },
     { label: (cartLocked ? S.resend : S.sendKitchen) + ' · ' + S.items(cartPlates()), cls: 'primary',
       act: function () { hideModal(); if (onSend) onSend(); } }]);
  m.querySelector('.cart-ls').addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.note) editNote(Number(b.dataset.note));
    else if (b.dataset.cdec) stepLine(Number(b.dataset.cdec), -1);
    else if (b.dataset.cinc) stepLine(Number(b.dataset.cinc), 1);
  });
}

function cartBusy() {
  if (sending) { toast(S.wait); return true; }
  if (cartLocked) { toast(S.locked, 'bad'); return true; }
  return false;
}

function stepLine(i, d) {
  var l = cart[i];
  if (!l || cartBusy()) return;
  var it = menuById[l.menuItemId];
  if (d > 0 && (!it || !it.available)) { toast(S.isKhatam(l.name), 'bad'); return; }
  l.qty += d;
  if (l.qty <= 0) cart.splice(i, 1);
  paintRow(l.menuItemId); paintCartBar();
  openCart();
}

var NOTE_CHIPS = ['Jain', 'Kam teekha', 'Extra teekha', 'Bina pyaaz', 'Bina lasan', 'Extra butter', 'Parcel'];

// The server caps a note at 200 BYTES; Hindi/Gujarati letters take 3 each.
function noteBytes(s) {
  return window.TextEncoder ? new TextEncoder().encode(s).length : s.length * 3;
}

function editNote(i) {
  var l = cart[i];
  if (!l || cartBusy()) return;
  var m = showModal(S.noteFor(l.name),
    '<div class="nchips">' + NOTE_CHIPS.map(function (c) {
      return '<button class="nchip" data-chip="' + esc(c) + '">' + esc(c) + '</button>';
    }).join('') + '</div>' +
    '<input id="mNote" maxlength="120" autocomplete="off" placeholder="' + esc(S.notePh) + '" value="' + esc(l.note) + '">' +
    '<div class="hint">' + esc(S.noteHint) + '</div>',
    [{ label: S.back, cls: 'ghost', act: openCart },
     { label: S.save, cls: 'primary', act: function () {
        var v = $('mNote').value.replace(/\s+/g, ' ').trim();
        if (noteBytes(v) > 200) { toast(S.noteLong, 'bad'); return; }
        setNote(l, v);
        openCart();
     } }]);
  // Chips add/remove their word in the text box; the box is the note.
  var parts = function () {
    return $('mNote').value.split(',').map(function (s) { return s.trim(); }).filter(Boolean);
  };
  var sync = function () {
    var have = parts().map(function (p) { return p.toLowerCase(); });
    m.querySelectorAll('.nchip').forEach(function (b) {
      b.classList.toggle('on', have.indexOf(b.dataset.chip.toLowerCase()) >= 0);
    });
  };
  m.querySelector('.nchips').addEventListener('click', function (e) {
    var b = e.target.closest('.nchip');
    if (!b) return;
    var p = parts(), k = -1;
    p.forEach(function (x, j) { if (x.toLowerCase() === b.dataset.chip.toLowerCase()) k = j; });
    if (k >= 0) p.splice(k, 1); else p.push(b.dataset.chip);
    $('mNote').value = p.join(', ');
    sync();
  });
  $('mNote').addEventListener('input', sync);
  sync();
}

// Two lines of the same dish with the same note are one line.
function setNote(l, v) {
  if (cart.indexOf(l) < 0) return;
  l.note = v;
  var twin = cart.filter(function (x) { return x !== l && x.menuItemId === l.menuItemId && x.note === v; })[0];
  if (twin) { twin.qty += l.qty; cart.splice(cart.indexOf(l), 1); }
  paintRow(l.menuItemId); paintCartBar();
}

// Sends the cart under its cartId. No answer, or a 5xx, means the server may
// have saved it: the same id is always safe to send again, so it retries by
// itself twice, then locks the cart and asks for "Dobara bhejo". A 4xx is a
// real "no" (nothing was saved), so the cart stays editable — and the same
// id stays valid, because the server never stored it.
async function sendCart(post, done) {
  if (sending || !cart.length) return;
  // A khatam dish we already know about: ask now, don't let the KOT bounce.
  // (Not for a locked cart — that one must go out exactly as first sent.)
  if (!cartLocked && offerDropKhatam()) return;
  sending = true; paintCartBar();
  var id = cartId;
  var items = cart.map(function (l) { return { menuItemId: l.menuItemId, qty: l.qty, note: l.note }; });
  var t0 = Date.now();
  for (var attempt = 1; ; attempt++) {
    try {
      var d = await post(id, items);
      sending = false; newCart(); paintCartBar();
      hideModal();   // a cart sheet opened while it was sending is now stale
      done(d);
      return;
    } catch (e) {
      var unsure = !!e.network || e.status >= 500;
      if (unsure && attempt < 3 && Date.now() - t0 < 8000) { await sleep(1000 * attempt); continue; }
      sending = false; cartLocked = unsure;
      paintCartBar();
      // Locked: the bar itself explains, and a toast would sit on its button.
      if (unsure) return;
      // 409 is how the server says "X is marked out of stock" (it went khatam
      // after the picker loaded): re-read the menu and offer to drop it.
      if (e.status === 409) {
        await loadMenu().catch(function () {});
        applyStock();
        if (offerDropKhatam()) return;
      }
      toast(e.message, 'bad');
      return;
    }
  }
}

async function sendTicket() {
  var t = openTable;
  await sendCart(function (id, items) {
    return api('POST', '/api/dining-tables/' + t.id + '/tickets', { clientTicketId: id, items: items });
  }, function (d) {
    toast(S.sentToast, 'ok');
    if (openTable !== t) return;
    if (d && d.tickets) { t.order = d; paintTable(); }   // the reply is the saved order
    else { paintTable(); refreshTable(); }
  });
}

// ---------------------------------------------------------------- parcel
// The server refuses a parcel whose name is over 60 BYTES (phone over 20),
// and that refusal bounced the whole parcel at "send". A Hindi or Gujarati
// letter is 3 bytes, so 60 is about 20 letters there — the browser's
// maxlength counts letters and let 60 of them through. These boxes stop at
// the byte limit instead, and say so.
var NAME_MAX = 60, PHONE_MAX = 20;
function fitBytes(s, max) {
  if (noteBytes(s) <= max) return s;
  var out = '';
  Array.from(s).some(function (ch) {
    if (noteBytes(out + ch) > max) return true;
    out += ch; return false;
  });
  return out;
}
function capBytes(el, max, warn) {
  var check = function (e) {
    if (e && e.isComposing) return;   // mid-word on an Indic keyboard: wait
    var v = fitBytes(el.value, max);
    if (v !== el.value) { el.value = v; if (warn) warn.hidden = false; }
  };
  el.addEventListener('input', check);
  el.addEventListener('compositionend', check);
}

// The parcel tab, like the app's parcel screen: the running parcels on top
// (tap one to see or add to it), then the form for a new one. The form's
// name and phone live in pcDraft, so Back from the menu — or a language
// switch — brings them back instead of a blank form.
var pcDraft = { name: '', phone: '' };

async function parcel() {
  $('view').innerHTML = '<div id="pcRun"></div><div id="pcForm"></div>';
  paintParcelForm();
  var paint = async function () {
    var d = await api('GET', '/api/tables');
    if (tab !== 'parcel' || openTable || pane || !$('pcRun')) return;
    var ps = (d.tables || []).filter(function (t) { return t.kind === 'parcel' && t.order; });
    $('pcRun').innerHTML = ps.length
      ? '<h2>🥡 ' + esc(S.runningParcels) + '</h2><div class="grid">' + ps.map(tableTile).join('') + '</div>' : '';
  };
  var my = nav;
  repaint = paint;
  await paint().catch(function () {});   // the form works without the list (the net strip says why)
  if (my === nav) timer = setInterval(function () { paint().catch(function () {}); }, 10000);
}

function paintParcelForm() {
  if (!$('pcForm')) return;
  $('pcForm').innerHTML =
    '<h2>' + esc(S.newParcel) + '</h2><div class="card">' +
    '<label class="fld"><span>' + esc(S.custName) + '</span><input id="pcName" autocomplete="off" placeholder="' + esc(S.namePh) + '">' +
      '<span class="note" id="pcLong" hidden style="display:block;margin-top:5px;font-size:12.5px;color:var(--amber)">' + esc(S.nameLong) + '</span></label>' +
    '<label class="fld"><span>' + esc(S.custPhone) + '</span><input id="pcPhone" inputmode="tel" autocomplete="off" placeholder="98xxxxxxxx"></label>' +
    '<button class="primary" id="pcNext" style="width:100%">' + esc(S.chooseItems) + '</button></div>' +
    '<p class="hint">' + esc(S.parcelHint) + '</p>';
  $('pcName').value = pcDraft.name;
  $('pcPhone').value = pcDraft.phone;
  capBytes($('pcName'), NAME_MAX, $('pcLong'));
  capBytes($('pcPhone'), PHONE_MAX, null);
  // (after capBytes, so the draft keeps the trimmed value)
  var keep = function (el, k) {
    var f = function () { pcDraft[k] = el.value; };
    el.addEventListener('input', f);
    el.addEventListener('compositionend', f);
  };
  keep($('pcName'), 'name');
  keep($('pcPhone'), 'phone');
  $('pcNext').onclick = function () {
    var nm = fitBytes($('pcName').value.trim(), NAME_MAX).trim();
    if (!nm) { toast(S.nameNeeded, 'bad'); return; }
    openTable = { parcelName: nm, parcelPhone: fitBytes($('pcPhone').value.trim(), PHONE_MAX).trim() };
    newCart();
    parcelMode = true;
    // menu didn't load (toast says why): stay on the form, list kept fresh
    picker('🥡 ' + nm, sendParcel).then(function (opened) { if (!opened) show('parcel'); });
  };
}

async function sendParcel() {
  var t = openTable;
  await sendCart(function (id, items) {
    return api('POST', '/api/parcels', {
      customerName: t.parcelName, customerPhone: t.parcelPhone, clientTicketId: id, items: items
    });
  }, function () {
    toast(S.parcelPlaced, 'ok');
    pcDraft = { name: '', phone: '' };   // placed: the next parcel starts blank
    show('tables');
  });
}

// ---------------------------------------------------------------- kitchen
async function kitchen() {
  var paint = async function () {
    var d = await api('GET', '/api/kitchen');
    if (tab !== 'kitchen') return;
    var bs = d.buckets || [];
    if (!bs.length) { $('view').innerHTML = '<div class="empty">' + esc(S.kitchenEmpty) + '</div>'; return; }
    // Each bucket wears its dish colour down the left edge (the kitchen's
    // identity — the chef cooks by colour), a styled state pill, its age, and
    // "30 (cap 15)" instead of an over-cap "30/15" that read like an error.
    $('view').innerHTML = '<h2>' + esc(S.kitchenHd) + '</h2>' + bs.map(function (b) {
      var cap = b.cap || d.cap;
      var fill = b.qty > cap ? '<span class="amber">' + esc(S.overCap(b.qty, cap)) + '</span>' : b.qty + '/' + cap;
      return '<div class="card bucket" style="border-left-color:' + dishColour(b.colour, b.menuItemId) + '">' +
        '<div class="row" style="margin-bottom:6px">' +
        '<b class="grow">' + esc(b.name) + '</b>' +
        '<span class="pill p-' + esc(b.status) + '">' + esc(S.bucket(b.status)) + '</span></div>' +
        '<div class="row mut tnum" style="font-size:13px;margin-bottom:2px">' +
          '<span>⏱ ' + esc(age(b.createdAt)) + '</span><span>🍽 ' + fill + '</span>' +
          (b.takenByName ? '<span class="grow" style="text-align:right">👨‍🍳 ' + esc(b.takenByName) + '</span>' : '') +
        '</div>' +
        (b.lines || []).map(function (l) {
          return '<div class="line"><span class="qty">' + l.qty + '×</span>' +
            '<span class="grow"><span class="nm">' + esc(l.tableName) + '</span>' +
            (l.note ? '<div class="note">📝 ' + esc(l.note) + '</div>' : '') + '</span>' +
            (l.done ? '<span class="pill p-ready">' + esc(S.status('ready')) + '</span>' : '') + '</div>';
        }).join('') + '</div>';
    }).join('');
  };
  var my = nav;
  repaint = paint;
  await paint().catch(function (e) {
    if (my === nav) failView(e, function () { show('kitchen'); });
  });
  if (my === nav) timer = setInterval(function () { paint().catch(function () {}); }, 8000);
}

paintChrome();
show('tables');
</script>
